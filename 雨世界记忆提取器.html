<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noisy Pup 记忆提取器</title>
<style>
:root{
  --bg:#f4f6f4; --surface:#ffffff; --surface2:#fafbfa;
  --line:#e2e5e1; --line2:#eef0ec;
  --ink:#1b211e; --ink2:#454f49; --muted:#87908a;
  --teal:#2f6f66; --teal-soft:#e9f2f0; --teal-line:#cfe4e0;
  --amber:#b9772e; --amber-soft:#fbf1e4; --amber-line:#f0dcc0;
  --rose:#b1524a; --rose-soft:#fbecea; --rose-line:#f2d7d4;
  --violet:#5f5590; --violet-soft:#efeef8; --violet-line:#dedcf0;
  --blue:#3d6c9e; --blue-soft:#eaf0f7; --blue-line:#d7e3f0;
  --r:14px;
  --sh:0 1px 2px rgba(24,36,30,.05), 0 6px 20px -12px rgba(24,36,30,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 500px at 80% -10%, #e8f1ef 0%, rgba(232,241,239,0) 60%),
    radial-gradient(900px 420px at 5% 0%, #f7f2e8 0%, rgba(247,242,232,0) 55%),
    var(--bg);
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
button{font-family:inherit;font-size:13px;cursor:pointer}
input,select{font-family:inherit;font-size:13px;color:var(--ink)}
::selection{background:#cfe4e0}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:14px;
  padding:12px 22px;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(12px) saturate(1.2);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{
  width:34px;height:34px;border-radius:10px;flex:none;
  background:linear-gradient(150deg,#3c8478,#26564f);
  display:grid;place-items:center;color:#eaf4f1;box-shadow:0 4px 12px -6px #26564f;
}
.logo svg{width:19px;height:19px}
.brand h1{font-size:15.5px;margin:0;font-weight:650;letter-spacing:.2px;white-space:nowrap}
.brand .sub{font-size:11.5px;color:var(--muted);margin-top:-2px;white-space:nowrap}
.spacer{flex:1}
.src{position:relative}
.src-chip{
  display:flex;align-items:center;gap:7px;max-width:450px;
  padding:6px 11px;border:1px solid var(--line);border-radius:999px;
  background:var(--surface2);font-size:12px;color:var(--ink2);transition:.14s;
}
.src-chip:hover{background:#fff;border-color:#c9cfc9;box-shadow:var(--sh)}
.src-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none;position:relative}
.src-chip.live .dot{background:#4f9c74;box-shadow:0 0 0 3px #e4f2ea}
.src-chip.live .dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid #4f9c74;animation:pulse 2s infinite}
.src-chip.warn .dot{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.src-chip.err .dot{background:var(--rose);box-shadow:0 0 0 3px var(--rose-soft)}
@keyframes pulse{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.8);opacity:0}}
.src-chip b{font-weight:600;color:var(--ink)}
.src-chip .file{font-weight:600;color:var(--ink);max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src-chip .sync{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.src-chip .chev{width:12px;height:12px;color:var(--muted);flex:none;transition:.16s}
.src-chip.open .chev{transform:rotate(180deg)}

.src-panel{
  position:absolute;right:0;top:calc(100% + 9px);width:356px;
  background:#fff;border:1px solid var(--line);border-radius:14px;
  box-shadow:0 26px 64px -30px rgba(20,30,26,.55);padding:14px 15px 13px;z-index:70;
  max-width:calc(100vw - 28px);
}
.src-panel[hidden]{display:none}
.sp-title{font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);font-weight:650;margin-bottom:7px}
.sp-row{display:flex;gap:12px;justify-content:space-between;align-items:baseline;padding:4px 0;border-bottom:1px dashed var(--line2);font-size:12.5px}
.sp-row .k{color:var(--muted);flex:none}
.sp-row .v{text-align:right;color:var(--ink);word-break:break-all;font-weight:500}
.sp-row .v.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;font-weight:400}
.sp-path{padding:5px 0 6px;border-bottom:1px dashed var(--line2)}
.sp-path .k{font-size:12.5px;color:var(--muted)}
.sp-path div{margin-top:2px;font-size:11px;line-height:1.5;word-break:break-all;color:var(--ink2);user-select:all;cursor:copy}
.sp-sep{height:10px}
.sp-auto{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:7px 9px;margin:2px 0 8px;background:var(--surface2);border:1px solid var(--line2);border-radius:9px;cursor:pointer;user-select:none}
.sp-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sp-actions .btn{flex:1;justify-content:center}
.sp-tip{margin-top:9px;font-size:11.5px;color:var(--muted);line-height:1.55}
.sp-tip code{background:var(--surface2);border:1px solid var(--line2);padding:0 4px;border-radius:4px;font-size:11px}
.sp-err{color:var(--rose)}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 13px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink2);
  transition:.14s ease; white-space:nowrap;
}
.btn:hover{border-color:#c9cfc9;background:#fff;color:var(--ink);box-shadow:var(--sh)}
.btn.primary{background:linear-gradient(180deg,#37796f,#2b6459);border-color:#2b6459;color:#f2f8f6;font-weight:600}
.btn.primary:hover{background:linear-gradient(180deg,#3d8378,#2f6c60);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--teal-soft);border-color:var(--teal-line)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:296px minmax(0,1fr);gap:20px;padding:20px 22px 60px;align-items:start;max-width:1560px;margin:0 auto}
aside{position:sticky;top:74px;max-height:calc(100vh - 96px);display:flex;flex-direction:column;gap:10px}
main{min-width:0}

/* ---------- sidebar ---------- */
.side-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.side-head{padding:12px 14px 8px;display:flex;align-items:center;justify-content:space-between}
.side-head .t{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:600}
.side-head .n{font-size:11px;color:var(--muted)}
.pup-list{overflow:auto;padding:4px 8px 8px;max-height:calc(100vh - 210px)}
.pup{
  display:flex;gap:10px;align-items:flex-start;
  padding:9px 10px;border-radius:11px;border:1px solid transparent;
  cursor:pointer;transition:.13s ease;position:relative;
}
.pup:hover{background:var(--surface2);border-color:var(--line2)}
.pup.on{background:var(--teal-soft);border-color:var(--teal-line)}
.pup.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--teal)}
.ava{
  width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
  font-size:12px;font-weight:700;color:#fff;letter-spacing:-.5px;
  background:linear-gradient(150deg,#4f9186,#31685f);
}
.pup .nm{font-weight:600;font-size:13.5px;line-height:1.25;display:flex;align-items:center;gap:5px}
.pup .meta{font-size:11px;color:var(--muted);margin-top:1px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.emod{width:6px;height:6px;border-radius:50%;display:inline-block;flex:none}
.pup.on .nm{color:#1f514a}
.mini-search{margin:0 10px 8px;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:5px 9px;background:var(--surface2)}
.mini-search input{border:0;outline:0;background:transparent;width:100%;font-size:12.5px}
.mini-search svg{width:13px;height:13px;color:var(--muted);flex:none}

.side-note{padding:10px 14px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--muted);line-height:1.55}

/* ---------- hero ---------- */
.hero{
  background:linear-gradient(150deg,#ffffff 0%,#fbfdfc 55%,#f3f8f6 100%);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:18px 20px 16px;margin-bottom:14px;
}
.hero-top{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.hero-ava{
  width:56px;height:56px;border-radius:16px;flex:none;display:grid;place-items:center;
  font-size:19px;font-weight:700;color:#fff;background:linear-gradient(150deg,#4f9186,#2c6058);
  box-shadow:0 10px 22px -14px #2c6058;
}
.hero h2{margin:0;font-size:22px;font-weight:680;letter-spacing:.3px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.hero .line2{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:6px}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;
  font-size:11.5px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);white-space:nowrap;
}
.chip.mono{font-family:ui-monospace,Consolas,monospace;letter-spacing:-.2px}
.chip.t{background:var(--teal-soft);border-color:var(--teal-line);color:#25645c}
.chip.a{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber)}
.chip.r{background:var(--rose-soft);border-color:var(--rose-line);color:var(--rose)}
.chip.v{background:var(--violet-soft);border-color:var(--violet-line);color:var(--violet)}
.chip.b{background:var(--blue-soft);border-color:var(--blue-line);color:var(--blue)}
.hero-actions{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;max-width:420px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line2);border-radius:11px;padding:9px 12px}
.stat .k{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat .v{font-size:20px;font-weight:680;line-height:1.25;font-variant-numeric:tabular-nums}
.stat .v small{font-size:11px;font-weight:500;color:var(--muted);margin-left:3px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:4px;margin:0 0 12px;border-bottom:1px solid var(--line);padding-bottom:0;overflow:auto}
.tab{
  border:0;background:transparent;color:var(--muted);padding:8px 13px;border-radius:9px 9px 0 0;
  font-size:13px;position:relative;white-space:nowrap;
}
.tab:hover{color:var(--ink);background:rgba(255,255,255,.6)}
.tab.on{color:var(--teal);font-weight:640}
.tab.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--teal);border-radius:2px}
.tab .cnt{font-size:11px;color:var(--muted);margin-left:5px;font-weight:500}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px}
.panel + .panel{margin-top:14px}
.panel h3{margin:0 0 12px;font-size:13px;font-weight:650;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.panel h3 .tag{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;border:1px solid var(--line);padding:1px 7px;border-radius:999px}
.hintline{font-size:12px;color:var(--muted);margin:-4px 0 10px}

.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(322px,1fr));gap:6px 36px}
.kv .row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line2);padding:5px 0;font-size:12.5px}
.kv .row .k{color:var(--muted);white-space:nowrap}
.kv .row .v{font-weight:600;text-align:right;word-break:break-word}

.emo-box{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.emo-now{font-size:17px;font-weight:650;display:flex;align-items:center;gap:8px}
.emo-age{font-size:12px;color:var(--muted)}

.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:grid;grid-template-columns:112px 1fr 42px;gap:10px;align-items:center;font-size:12px}
.bar-row .lb{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{display:block;height:7px;border-radius:6px;background:var(--line2);overflow:hidden}
.bar-fill{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#79b3a7,#2f6f66)}
.bar-row .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}

.quote{font-size:12.5px;color:var(--ink2);background:var(--surface2);border-left:2px solid var(--teal-line);padding:6px 11px;border-radius:0 8px 8px 0;margin:6px 0}

/* ---------- toolbar ---------- */
.toolbar{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 12px;margin-bottom:12px;box-shadow:var(--sh);
}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--surface2)}
.search:focus-within{border-color:var(--teal-line);background:#fff;box-shadow:0 0 0 3px var(--teal-soft)}
.search input{border:0;background:transparent;outline:0;width:100%;font-size:13px}
.search svg{width:14px;height:14px;color:var(--muted);flex:none}
select{border:1px solid var(--line);border-radius:9px;padding:6px 9px;background:var(--surface);outline:0}
select:focus{border-color:var(--teal-line)}
.kind-chips{display:flex;gap:6px;flex-wrap:wrap}
.kchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--ink2);transition:.13s}
.kchip:hover{border-color:#c9cfc9}
.kchip.on{border-color:#2f6f66;background:#2f6f66;color:#fff}
.kchip .c{opacity:.65;font-size:11px;margin-left:3px}
.tb-right{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}

/* ---------- memory cards ---------- */
.mem-list{display:flex;flex-direction:column;gap:9px}
.mem{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:11px 14px;transition:.14s ease;
}
.mem:hover{border-color:#cfd6cf;box-shadow:0 6px 18px -14px rgba(24,36,30,.5)}
.mem-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.badge{font-size:11px;padding:1.5px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.k0{background:var(--amber-soft);color:#96601c;border:1px solid var(--amber-line)}
.k1{background:#f2f3f1;color:#6f7a72;border:1px solid #e4e7e3}
.k2{background:var(--teal-soft);color:#25645c;border:1px solid var(--teal-line)}
.k3{background:var(--violet-soft);color:#534a80;border:1px solid var(--violet-line)}
.tagtxt{font-size:12px;color:var(--ink2);font-weight:600}
.tagraw{font-size:11px;color:var(--muted);font-family:ui-monospace,Consolas,monospace}
.mem .age{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.mem .body{font-size:13.5px;line-height:1.65;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.mem .body.own{color:#1f4b45}
.mem .body.empty{color:var(--muted);font-style:italic;font-size:12.5px}
.mem .hint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.55}
.mem .ref{font-size:12px;color:#5b6b62;margin-top:6px;padding:5px 10px;background:#f7faf8;border:1px dashed #d9e6df;border-radius:8px}
.mem .ref b{color:#2f6f66;font-weight:600}
.mem-foot{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:8px;padding-top:7px;border-top:1px dashed var(--line2);font-size:11px;color:var(--muted)}
.mf{display:flex;align-items:center;gap:5px}
.mbar{display:block;width:52px;height:5px;border-radius:4px;background:var(--line2);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#8dbfb4,#2f6f66)}
.mbar.warn i{background:linear-gradient(90deg,#e0b184,#b9772e)}
.mem .idx{font-size:10.5px;color:#b3bab4;font-family:ui-monospace,Consolas,monospace}

.empty-list{text-align:center;color:var(--muted);font-size:13px;padding:40px 0}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:11px;padding:4px 2px}
.msg{display:flex;gap:9px;max-width:86%}
.msg.me{margin-left:auto;flex-direction:row-reverse}
.msg .wh{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;background:linear-gradient(150deg,#7d8f86,#5d6d64)}
.msg.me .wh{background:linear-gradient(150deg,#557fb0,#3d6c9e)}
.bub{border:1px solid var(--line);background:var(--surface);border-radius:3px 12px 12px 12px;padding:8px 12px;font-size:13.5px;line-height:1.6;box-shadow:0 1px 2px rgba(24,36,30,.03)}
.msg.me .bub{background:var(--blue-soft);border-color:var(--blue-line);border-radius:12px 3px 12px 12px;color:#274a6f}
.msg.own .bub{background:var(--teal-soft);border-color:var(--teal-line);border-radius:3px 12px 12px 12px;color:#1f4b45}
.msg.peer .bub{background:#f6f4fb;border-color:var(--violet-line);border-radius:3px 12px 12px 12px;color:#3d3758}
.msg .bubwrap{min-width:0;max-width:100%}
.msg .who2{font-size:11px;color:var(--muted);margin:0 2px 3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;line-height:1.3}
.msg.me .who2{justify-content:flex-end}
.msg .who2 b{font-weight:650}
.msg .tochip{font-size:10.5px;background:var(--surface2);border:1px solid var(--line2);border-radius:999px;padding:0 6px;color:var(--ink2);white-space:nowrap}
.chatbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:2px 0 14px}
.chatinfo{margin-left:auto;font-size:11.5px;color:var(--muted)}
.spkname{font-weight:650;opacity:.9}
.bub .meta2{font-size:10.5px;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.msg.me .bub .meta2{justify-content:flex-end}
.silent{align-self:center;font-size:11.5px;color:var(--muted);background:var(--surface2);border:1px dashed var(--line);border-radius:999px;padding:3px 12px;max-width:80%;text-align:center}

/* ---------- impressions ---------- */
.imp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.imp{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;box-shadow:var(--sh)}
.imp-top{display:flex;align-items:flex-start;gap:10px}
.imp .nm{font-weight:660;font-size:14.5px;line-height:1.3}
.imp .tp{font-size:11px;color:var(--muted);font-family:ui-monospace,Consolas,monospace}
.aff{margin:10px 0 6px}
.aff-top{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.aff-track{position:relative;height:8px;border-radius:6px;background:var(--line2);overflow:hidden}
.aff-track .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#cdd4cd}
.aff-fill{position:absolute;top:0;bottom:0;border-radius:4px}
.aff-fill.pos{left:50%;background:linear-gradient(90deg,#a9d3c8,#2f6f66)}
.aff-fill.neg{right:50%;background:linear-gradient(270deg,#e8b3ae,#b1524a)}
.imp .mood{font-size:13px;font-weight:600;margin:7px 0 3px}
.imp .desc{font-size:12.5px;color:var(--ink2);line-height:1.6}
.imp .cnts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.cnt-chip{font-size:11px;background:var(--surface2);border:1px solid var(--line2);border-radius:7px;padding:2px 7px;color:var(--ink2)}
.cnt-chip.click{cursor:pointer}
.cnt-chip.click:hover{border-color:var(--teal);color:var(--teal)}
.cnt-chip b{color:var(--ink);font-weight:650}
.cnt-chip.neg{background:var(--rose-soft);border-color:var(--rose-line);color:#7d3b35}
.imp .ref2{margin-top:10px;padding:8px 10px;border-radius:9px;background:#f7faf8;border:1px dashed #d9e6df;font-size:12px;color:#4d5f57;line-height:1.6}
.imp .ref2 .ttl{font-size:10.5px;color:var(--muted);letter-spacing:.6px;margin-bottom:2px}

/* ---------- raw ---------- */
pre.raw{margin:0;max-height:620px;overflow:auto;background:#fbfcfb;border:1px solid var(--line2);border-radius:11px;padding:14px 16px;font-size:12px;line-height:1.65;color:#2b332e}
pre.raw .k{color:#2f6f66}

/* ---------- drop / toast ---------- */
#drop{
  position:fixed;inset:0;z-index:80;display:none;place-items:center;
  background:rgba(232,241,239,.86);backdrop-filter:blur(6px);
}
#drop.on{display:grid}
#drop .box{border:2px dashed #7aa9a0;border-radius:22px;padding:44px 64px;background:#fff;text-align:center;box-shadow:0 30px 80px -40px rgba(24,36,30,.5)}
#drop .box h3{margin:0 0 6px;font-size:17px}
#drop .box p{margin:0;color:var(--muted);font-size:13px}
#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
  background:#1f2a25;color:#eef5f2;padding:9px 16px;border-radius:999px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:.24s ease;z-index:90;box-shadow:0 10px 30px -12px rgba(0,0,0,.5)
}
#toast.on{opacity:1;transform:translate(-50%,0)}
#empty{padding:80px 20px;text-align:center}
#empty .big{font-size:17px;font-weight:650;margin-bottom:6px}
#empty p{color:var(--muted);margin:0 0 18px}
.foot{padding:26px 4px 0;font-size:11.5px;color:var(--muted);line-height:1.7}
.foot code{background:var(--surface2);border:1px solid var(--line2);padding:1px 5px;border-radius:5px;font-size:11px}
@media (max-width:1000px){
  .layout{grid-template-columns:1fr}
  aside{position:static;max-height:none}
  .pup-list{max-height:280px}
}

/* ---------- journey（旅程日志） ---------- */
.jv-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.jv-chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);background:#fff;color:var(--ink2);cursor:pointer}
.jv-chip.on{background:#1f2a25;color:#eef5f2;border-color:#1f2a25}
.jv-list{display:flex;flex-direction:column;gap:8px}
.jv-row{display:grid;grid-template-columns:62px 84px 1fr;gap:10px;padding:9px 12px;border:1px solid var(--line2);border-radius:11px;background:#fff}
.jv-t{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.jv-k{font-size:11.5px;font-weight:650;color:#2f6f66}
.jv-b{font-size:12.8px;line-height:1.62;color:#26302b;min-width:0;word-break:break-word}
.jv-row.see .jv-k{color:#3d6b8f}
.jv-row.ai .jv-k{color:#7a5aa0}
.jv-row.verdict .jv-k,.jv-row.impr .jv-k{color:#b1653c}
.jv-row.mem .jv-k{color:#6b7280}
.jv-row.name .jv-k{color:#a06a2c}
.jv-sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.jv-pre{margin:6px 0 0;white-space:pre-wrap;font-size:11.5px;line-height:1.55;background:#fbfcfb;border:1px dashed var(--line2);border-radius:8px;padding:8px 10px;max-height:260px;overflow:auto}
.jv-empty{padding:56px 20px;text-align:center;color:var(--muted);line-height:1.9}

/* ---------- 对话模式 ---------- */
.dlg-list{display:flex;flex-direction:column;gap:12px}
.dlg{border:1px solid var(--line2);border-radius:12px;background:var(--surface);padding:9px 12px 11px;box-shadow:var(--sh)}
.dlg-h{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:7px}
.dlg-body{display:flex;flex-direction:column;gap:7px}
.dlg-turn{display:flex;gap:8px;max-width:88%;align-items:flex-start}
.dlg-turn.them{align-self:flex-start}
.dlg-turn.me{align-self:flex-end}
.dlg-who{font-size:11.5px;color:var(--muted);white-space:nowrap;padding-top:6px}
.dlg-bub{font-size:13px;line-height:1.62;padding:7px 11px;border-radius:11px;border:1px solid var(--line2);background:var(--surface2);color:var(--ink2);word-break:break-word}
.dlg-turn.me .dlg-bub{background:var(--teal-soft);border-color:var(--teal-line);color:#22443f}
.dlg-th{font-size:11.5px;line-height:1.55;color:var(--violet);background:var(--violet-soft);border-left:2px solid var(--violet-line);border-radius:0 8px 8px 0;padding:5px 9px}
.dlg-th .dlg-meta{color:var(--muted);margin-left:6px}
.dlg-note{align-self:center;font-size:11px;color:var(--muted);background:var(--surface2);border:1px dashed var(--line);border-radius:999px;padding:2px 9px}
.jv-hint{font-size:11.5px;color:var(--muted)}
.dlg-inner{font-size:11.5px;line-height:1.55;color:var(--muted);padding:0 2px}
/* ---------- 日志对话 ---------- */
.jd-head{font-size:11px;color:var(--amber);font-weight:650;letter-spacing:.2px;margin-bottom:2px}
.jd-mark{font-size:11.5px;line-height:1.6;color:var(--ink2);background:var(--surface2);border:1px dashed var(--line);border-radius:8px;padding:4px 9px}
.jd-mark.mem{color:var(--ink2)}
.jd-mark.impr{color:var(--teal);border-color:var(--teal-line);background:var(--teal-soft)}
.jd-mark.forget{color:var(--rose);border-color:var(--rose-line);background:var(--rose-soft)}
.jd-mark.verdict{color:var(--violet);border-color:var(--violet-line);background:var(--violet-soft)}
.jd-mark.name{color:var(--amber);border-color:var(--amber-line);background:var(--amber-soft)}
.chip.warn{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber);display:inline-flex;align-items:center;gap:5px}
.chip.warn .x{cursor:pointer;font-weight:700;color:var(--amber)}
</style>

function zhOf(type){
  if(!type) return '';
  if(MAPS.creature[type]) return MAPS.creature[type];
  if(MAPS.item[type]) return MAPS.item[type];
  const low = String(type).toLowerCase();
  for(const k in MAPS.creature) if(low.includes(k.toLowerCase())) return MAPS.creature[k];
  for(const k in MAPS.item) if(low.includes(k.toLowerCase())) return MAPS.item[k];
  return type;
}
function speciesZh(s){
  if(!s) return '未知';
  return MAPS.species[s] || zhOf(s) || s;
}

function nameSourceOf(srcKey, namedByAi, name){
  // 有显式来源键就直接用
  if(srcKey && NAME_SOURCES[srcKey]) return srcKey;
  // 老存档没有来源字段：占位名→预置名，其余→AI 起名（当成随口想的）
  if(!name || /^小幼猫/.test(name)) return 'Preset';
  return namedByAi ? 'Random' : 'Preset';
}
function nameSourceLabel(src){ return (NAME_SOURCES[src]||{}).label || '未知'; }
function attitudeOf(type){
  if(!type) return null;
  // Slugpup 在态度表里没有独立条目，模组里回退到 SlugNPC
  return MAPS.att[type] || (type==='Slugpup' ? MAPS.att['SlugNPC'] : null) || null;
}
/* 态度 → 好感点数（与 C# Names.AttitudeBase 一致；依恋 / 想吃 / 无聊 / 敬畏 不计） */
function attitudeScore(type){
  const a = attitudeOf(type);
  if(!a) return 0;
  const L = Number(a.s||0) > 0 ? Number(a.s) : 1;
  const f = String(a.f||'');
  let s = 0;
  if(f.includes('喜爱')) s += 5*L;
  if(f.includes('珍贵')) s += 3*L;
  if(f.includes('好玩')) s += 3*L;
  if(f.includes('好奇')) s += 2*L;
  if(f.includes('恐惧')) s -= 10*L;
  if(f.includes('警惕')) s -= 7*L;
  if(f.includes('讨厌') || f.includes('厌恶')) s -= 5*L;
  return s;
}
function tagDesc(tag){
  if(!tag) return '（无标签）';
  const by = tag.match(/^(.*?)\s+by\s+(.+)$/i);
  if(by){
    const verb = by[1].trim(), who = by[2].trim();
    const whoZh = who==='Slugcat' ? '你' : zhOf(who);
    if(TAG_BY[verb]) return TAG_BY[verb].replace('%s', whoZh);
    const v = TAG_EXACT[verb] || TAG_PREFIX[verb+' '] || verb;
    return v + '「' + whoZh + '」';
  }
  if(TAG_EXACT[tag]) return TAG_EXACT[tag];
  for(const p in TAG_PREFIX){
    if(tag.startsWith(p)) return TAG_PREFIX[p] + '「' + zhOf(tag.slice(p.length).trim()) + '」';
  }
  return tag;
}
function tagType(tag){ // 从标签里取出涉及的生物/物品类型
  if(!tag) return null;
  const by = tag.match(/\s+by\s+(.+)$/i);
  if(by) return by[1].trim();
  const m = tag.match(/^(SeeFood|See|Kill|Grab|Throw|PlayerGrab|PlayerGaveToy|Catch|Hurt|Attack|Hear|Eat)\s+(.+)$/i);
  if(m) return m[2].trim();
  return null;
}
function fmtAge(sec, short){
  if(sec==null||isNaN(sec)||sec<0) return '—';
  sec = Math.round(sec);
  if(sec<60) return sec+(short?'s':' 秒前');
  const m=Math.floor(sec/60), s=sec%60;
  if(m<60){
    if(short) return m+'m'+(s?String(s).padStart(2,'0')+'s':'');
    return s ? m+' 分 '+s+' 秒前' : m+' 分前';
  }
  const h=Math.floor(m/60), mm=m%60;
  if(short) return h+'h'+(mm?String(mm).padStart(2,'0')+'m':'');
  return mm ? h+' 小时 '+mm+' 分前' : h+' 小时前';
}
function fmtDur(sec){
  sec=Math.round(sec);
  if(sec<60) return sec+' 秒';
  const m=Math.floor(sec/60), s=sec%60;
  if(m<60) return m+' 分'+(s?(' '+s+' 秒'):'');
  const h=Math.floor(m/60), mm=m%60;
  return h+' 时'+(mm?(' '+mm+' 分'):'');
}
/* 时长（不带"前"），用于"情绪持续 5 秒"这类描述 */
function fmtSpan(sec){
  if(sec==null||isNaN(sec)) return '—';
  sec=Math.round(sec);
  if(sec<60) return sec+' 秒';
  const m=Math.floor(sec/60), s=sec%60;
  if(m<60) return s?(m+' 分 '+s+' 秒'):(m+' 分');
  const h=Math.floor(m/60), mm=m%60;
  return mm?(h+' 小时 '+mm+' 分'):(h+' 小时');
}
function fmtTick(t){ if(t==null||isNaN(t)) return '—'; return 'T'+t+'（约 '+fmtDur(t/40)+'）'; }
function emoColor(e){
  const s=String(e||'');
  if(/怕|恐惧|慌|紧张|不安/.test(s)) return '#b1524a';
  if(/气|怒|凶|烦/.test(s)) return '#b9772e';
  if(/委屈|难过|失落|闷/.test(s)) return '#5f5590';
  if(/好奇|兴趣/.test(s)) return '#3d6c9e';
  if(/开心|满足|安心|喜欢|亲近/.test(s)) return '#2f6f66';
  if(/无聊|懒/.test(s)) return '#87908a';
  return '#6b7a72';
}
function initials(n){ const s=String(n||'?'); return s.length<=2? s : s.slice(0,2); }

/* affinity 与 C# Impression.Affinity 完全一致：基线 + 累计行为 + 最近语气 */
function baseAffinity(imp){
  let b = Number(imp.BaseAffinity||0);
  if(Math.abs(b) < 1e-4) b = attitudeScore(imp.Type)*0.04;
  return b;
}
/* 最近语气：约 8 分钟衰减到三分之一 */
function sentimentNow(imp, now){
  const s = Number(imp.Sentiment||0);
  if(!s) return 0;
  const tick = Number(imp.SentimentTick||0);
  if(!now || now<=0 || tick<=0) return s;
  const age = Math.max(0, (now-tick)/TICK_RATE);
  return s*Math.exp(-age/480);
}
/* 遗忘标签：每枚让印象朝 0 靠近 0.1 */
function forgetTags(imp){ return Math.max(0, Number(imp.Forgot||0)); }
function affinity(imp, now){
  const g=k=>Number(imp[k]||0);
  const pos = g('Helped')*0.50 + g('HelpedThem')*0.25 + g('Fed')*0.45 + g('Played')*0.30
            + g('Carried')*0.15 + g('CarriedIt')*0.05 + g('Meowed')*0.10 + g('SavedThem')*0.30
            + g('Chatted')*0.04 + g('Together')*0.004 + g('GaveToy')*0.28 + g('ToldFollow')*0.05
            + g('RescuedMe')*1.20 + g('Cared')*0.25 + g('Loved')*0.45 + g('KilledEnemy')*0.80
            + g('SleptTogether')*0.60
            + g('StoodBetween')*0.70 + g('PulledFromWater')*1.00
            + g('GaveUpChase')*0.25 + g('DroveItOff')*0.35 + g('NuzzledMe')*0.20
            + g('SavedMeWithIt')*1.20 + g('SleptWith')*0.55
            + g('LitTheDark')*0.35 + g('HitWithIt')*0.12 + g('KeptSafe')*0.25
            + g('GiftedToMe')*0.45 + g('GaveAsGift')*0.25
            + g('Trophy')*0.40 + g('HelpedKill')*0.90
            + g('HeardGood')*0.14;
  const neg = g('Hurt')*0.90 + g('Grabbed')*0.70 + g('Killed')*1.00 + g('Feared')*0.30
            + g('Threatened')*0.60 + g('ThreatenedThem')*0.30
            + g('Scolded')*0.50 + g('ScoldedThem')*0.40
            + g('DrivenAway')*0.40 + g('DrivenAwayThem')*0.30
            + g('Wronged')*0.30 + g('KilledFriend')*2.50
            + g('ToldStay')*0.08 + g('Ignored')*0.20 + g('Isolated')*0.25
            + g('GangedUp')*0.50 + g('TookMyBeloved')*0.70
            + g('LostIt')*0.20 + g('WasTaken')*0.50
            + g('Badmouth')*0.55 + g('HeardBad')*0.14;
  const raw = baseAffinity(imp) + pos - neg;
  const a = Math.max(-1, Math.min(1, raw/(1+Math.abs(raw))));
  let out = Math.max(-1, Math.min(1, a + sentimentNow(imp, now)*0.55));
  const n = forgetTags(imp);
  if(n){
    const mag = Math.abs(out) - n*0.1;
    out = mag <= 0 ? 0 : (out > 0 ? mag : -mag);
  }
  return out;
}
function mood(imp, you, now){
  const a=affinity(imp, now), g=k=>Number(imp[k]||0);
  if(imp.Dead){
    if(a < -0.2) return you ? '你已经死了，我不再怕你' : '它已经死了，我不再怕它';
    if(a > 0.2)  return you ? '你已经死了，我还挺难过' : '它已经死了，我还挺难过';
    return you ? '你已经死了' : '它已经死了';
  }
  const soft = g('Wronged')+g('Scolded')+g('Threatened')+(you?g('DrivenAway'):0)+g('KilledFriend')
             > g('Hurt')+g('Grabbed')+g('Feared');
  if(a>0.5)  return you ? '我很信任你' : (g('Fed')+g('Helped')+g('Played')>0 ? '很信任它':'很亲近它');
  if(a>0.15) return you ? '我挺喜欢你' : '挺喜欢它';
  if(a<-0.6) return soft ? (you?'我又气又防着你':'又气又防着它') : (you?'我很怕你':'很怕它');
  if(a<-0.45) return soft ? (you?'我有点怨你':'有点怨它') : (you?'我有点怕你':'挺怕它');
  if(a<-0.2) return soft ? (you?'我有点怨你':'有点怨它') : (you?'我对你很戒备':'对它很戒备');
  return you ? '我还说不上什么感觉' : '说不上什么感觉';
}
function describeImp(imp, you){
  const g=k=>Number(imp[k]||0), P=[];
  const add=(f,lo,hi,th)=>{ const n=g(f); if(n<=0) return; P.push((n>=(th||3)&&hi)?hi:lo); };
  add('Helped', you?'你帮过我':'帮过我', you?'你总愿意帮我':'总愿意帮我');
  add('HelpedThem', you?'我护过你':'我护过它', you?'我常护着你':'我常护着它');

  add('GaveToy', you?'你送过我东西':'送过我东西', you?'你常带东西给我':'常带东西给我');
  add('Played', you?'你陪我玩过':'陪我玩过', you?'你常陪我玩':'常陪我玩');
  add('Carried', you?'你抱过我':'抱过我', you?'你总把我抱在身边':'总把我抱在身边');
  add('CarriedIt', you?'我抱过你':'我抱过它', you?'我常常抱着你':'我常常抱着它');
  add('Feared', you?'我有点怕你':'我有点怕它', you?'我打心底怕你':'我打心底怕它');

  add('ToldFollow', you?'你叫我跟着你':'叫我跟着它');
  add('SavedThem', you?'我救过你':'我救过它', you?'我常保护你':'我常保护它');

  add('KilledFriend', you?'你杀死了我的朋友':'杀死朋友', you?'你杀死了我的朋友，还不止一个':'杀死朋友，还不止一个', 2);
  add('KilledEnemy', you?'你帮我杀掉了祸害':'杀死敌人', you?'你帮我除掉过好几个祸害':'帮我除掉过好几个祸害', 2);
  add('Cared', '你关心过我', '你总在关心我');
  add('Loved', '你对我说过爱我', '你总对我说爱我');
  add('Hurt', you?'你伤过我':'伤过我', you?'你不止一次伤过我':'不止一次伤过我');
  add('Wronged', you?'你有次不小心伤到我':'有次不小心伤过我', you?'你有几回不小心伤到我':'好几回误伤我');
  add('Grabbed', you?'你粗暴地抓过我':'粗暴地抓过我', you?'你常粗暴地抓我':'常粗暴地抓我');
  add('Threatened', you?'你凶过我':'凶过我', you?'你总对我很凶':'总对我很凶');
  add('ThreatenedThem', you?'我凶过你':'我凶过它', you?'我常凶你':'我常凶它');
  add('Scolded', you?'你骂过我':'骂过我', you?'你总爱骂我':'总爱骂我');
  add('ScoldedThem', you?'我骂过你':'我骂过它', you?'我常骂你':'我常骂它');
  add('DrivenAway', '你赶走过我', '你总把我赶走');
  add('DrivenAwayThem', you?'我赶过你走':'我赶过它走', you?'我常赶你走':'我常赶它走');
  if(g('ToldStay')) P.push(you?'你让我等过':'让我等过');
  add('Ignored', you?'你有时不理我':'有时不理我', you?'你常常不理我':'常常不理我');
  add('Isolated', you?'你把我独自丢下过':'把我独自丢下过', you?'你好几次把我独自丢下':'好几次把我独自丢下');
  if(g('Killed')) P.push(you?'我害死过你':'我害死过它');
  if(g('Chatted') && !g('Helped') && !g('Hurt') && !g('Threatened')) P.push(you?'愿意跟你说话':'愿意跟我说话');
  if(g('Together')>=3) P.push('常待在一起');
  if(imp.Dead) P.push(you?'你已经死了':'它已经死了');
  if(!P.length){
    const att = attitudeOf(imp.Type);
    if(att && att.v) return att.v;
    return g('Met')>1 ? (you?'我们见过几回':'见过几回') : (you?'我们刚见过':'刚见过');
  }
  return P.join('、');
}

/* ============================================================ 解析 */
let DB = null, PUPS = [], SEL = null, TAB='overview', SOURCE='';
const F = {q:'', kinds:new Set([0,1,2,3]), cat:'all', tag:'all', sort:'new', useFilterExport:false, chatMode:'all'};

function parseMemories(text){
  let t = String(text||'').replace(/^\uFEFF/,'').trim();
  if(!t) throw new Error('文件是空的');
  let db;
  try{ db = JSON.parse(t); }catch(e){ throw new Error('JSON 解析失败：'+e.message); }
  if(!db || typeof db!=='object') throw new Error('不是有效的 JSON 对象');
  const pups = db.Pups || db.pups;
  if(!pups || typeof pups!=='object' || Array.isArray(pups)) throw new Error('找不到 Pups 字段（不是 Noisy Pup 记忆文件？）');
  return db;
}
function normalize(db){
  DB = db;
  const pups = db.Pups || db.pups || {};
  PUPS = Object.entries(pups).map(([key,rec])=>{
    rec = rec || {};
    const mem = (rec.LongMemory||[]).map((m,i)=>({...m, _i:i}));
    const nowTick = Number(rec.LastSeenTick||0);
    const imps = Object.entries(rec.Impressions||{}).map(([k,v])=>{
      const im = {...v, _key:k, _now:nowTick};
      im._base = baseAffinity(im);
      im._sent = sentimentNow(im, nowTick);
      im._aff = affinity(im, nowTick);
      return im;
    });
    return {
      key, name: rec.Name || '未命名', species: rec.Species || '', speciesZh: speciesZh(rec.Species),
      emotion: rec.CurrentEmotion || '', emoAge: rec.EmotionAgeSeconds,
      firstTick: rec.FirstTick, lastTick: rec.LastSeenTick, namedByAi: !!rec.NamedByAi,
      nameSource: nameSourceOf(rec.NameSource, rec.NamedByAi, rec.Name),
      counters: rec.Counters || {}, lines: rec.RecentLines || [], mem, imps, raw: rec
    };
  }).sort((a,b)=> a.name.localeCompare(b.name,'zh'));
  // 把印象里的旧名字对齐到当前名字
  const byKey = Object.fromEntries(PUPS.map(p=>[p.key,p.name]));
  for(const p of PUPS) for(const im of p.imps){
    if((im.Type==='Slugpup'||im.Type==='SlugNPC') && byKey[im._key]) im._live = byKey[im._key];
  }
  annotateSpeakers();
  SEL = PUPS.length ? PUPS[0].key : null;
}

/* ------------------------------------------------------------
   说话人与对象
   模组的记忆里：Kind2 = 本猫说的；Kind3 = 听到别人说的，
   SpeakerName 才是真正的说话人（可能是"你"，也可能是另一只猫）。
   存档没有保存"这句说给谁听"，所以对象只能按上下文推断，并在界面上标明。
------------------------------------------------------------ */
const PUP_PALETTE = ['#5f5590','#b9772e','#b1524a','#3f7f8c','#7a6a3c','#6b5b95'];
function pupColor(name){
  let h=0; const s=String(name||'');
  for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0;
  return PUP_PALETTE[h % PUP_PALETTE.length];
}
function speakerColor(role, name, selfName){
  if(role==='player') return '#3d6c9e';
  if(role==='self') return '#2f6f66';
  return pupColor(name);
}
function annotateSpeakers(){
  const names = new Set(PUPS.map(p=>p.name));
  const fix = {};   // 旧名 → 现名
  for(const p of PUPS) for(const im of p.imps){
    if(im.Name && im._live && im.Name!==im._live) fix[im.Name] = im._live;
  }
  const realName = n => names.has(n) ? n : (fix[n] || n);
  const roleOf = (name, self) => {
    if(!name) return 'self';
    if(name===self.name) return 'self';
    if(name==='你' || name==='玩家' || name==='大猫') return 'player';
    return names.has(realName(name)) ? 'pup' : 'other';
  };

  for(const p of PUPS){ try{
    const chrono = p.mem.slice().sort((a,b)=> Number(b.AgeSeconds)-Number(a.AgeSeconds)); // 由早到晚
    const hist = [];   // 时间顺序上"谁说过话"，用来找回应对象
    for(const m of chrono){
      const kind = Number(m.Kind);
      m._kind = kind;
      const raw = m.SpeakerName || '';
      if(kind===2){ m._role='self'; m._speaker=p.name; }
      else if(kind===3){ m._role=roleOf(raw,p); m._speaker = m._role==='player' ? '你' : realName(raw||'?'); }
      else { m._role='self'; m._speaker=p.name; }   // 触发事件是它自己观察到的

      const text = (m.Text||'').trim();
      // 没有台词的事件（触发·开口/沉默）不谈"对谁说"
      m._to = text ? inferTo(m, p, hist) : null;
      if(text) hist.push({name:m._speaker, role:m._role});
    }
  }catch(e){ console.warn('说话人标注失败', e); } }
}

/* 推断"这句说给谁听"。存档没存对象，只能按线索排优先级：
   ① 台词里直呼某只猫的名字 → 大概率在对它说；
   ② 句首是个称呼（可能是小名，如"团子"指雪团）→ 按共用字猜，标"推断"；
   ③ 标签是 Respond → 回应上一条"不是自己说的"那句；
   ④ 玩家相关标签 / 出现"家长、妈妈" → 对玩家；
   ⑤ 同伴在说话而屋里没别的线索 → 多半在对本猫说，标"推断"。 */
function lastOtherFor(hist, me){
  for(let i=hist.length-1; i>=0; i--) if(hist[i].name !== me) return hist[i];
  return null;
}
function inferTo(m, p, hist){
  const tag = m.EventTag || '';
  const text = (m.Text||'').trim();
  if(m._role==='player') return {who:'在场的猫崽', kind:'group'};

  // ⓿ 存档里明确记了收话人（对着物品 / 某个东西说话）：以它为准，不再猜
  const addr = (m.Addressee||'').trim();
  if(addr) return {who:addr, kind: m.AddresseeIsItem ? 'item' : 'other', exact:true};

  // ① 点名：叫名字 = 在对它说；只是顺口提到 → 记为 mention，不抢走"对谁说"
  let named=null, at=1e9;
  for(const q of PUPS){
    if(q.key===p.key || q.name===m._speaker) continue;
    const i = text.indexOf(q.name);
    if(i>=0 && i<at){ named=q; at=i; }
  }
  let mention=null;
  if(named){
    const after = text.charAt(at + named.name.length);
    const addressed = at<=4 || (at<=10 && /[，,！!…、：:]/.test(after));
    if(addressed) return {who:named.name, kind:'pup'};
    mention = named.name;
  }

  // ② 句首称呼，可能是小名（"团子"→雪团）
  const voc = text.match(/^([\u4e00-\u9fa5]{2,4})[，,、：:！!…—\-\s]/);
  if(voc && !/[就了是不我你他她它这那谁什么吧啊呢吗]/.test(voc[1])){
    for(const q of PUPS){
      if(q.key===p.key || q.name===m._speaker) continue;
      if([...voc[1]].some(ch=>q.name.indexOf(ch)>=0))
        return {who:q.name, kind:'pup', guess:true, nick:voc[1], mention};
    }
  }

  // ③ 回应上一句（往前找最近一个"不是自己"的说话人）
  if(/^Respond/i.test(tag)){
    const o = lastOtherFor(hist, m._speaker);
    if(o) return {who:o.name, kind:o.role, mention};
  }

  // ④ 玩家相关事件
  if(/Player|Slugcat|Onback|Outback|Waiting|Following|Meow/i.test(tag))
    return {who:'你', kind:'player', mention};
  if(/家长|妈妈/.test(text))
    return {who:'你', kind:'player', mention};

  // ⑤ "你"指向最近的对话方（拿不准，标推断）
  if(/你|您/.test(text)){
    const o = lastOtherFor(hist, m._speaker);
    if(o) return {who:o.name, kind:o.role, guess:true, mention};
  }

  // ⑥ 同伴在说话，而屋里没别的线索
  if(m._role==='pup') return {who:p.name, kind:'self', guess:true, mention};

  return mention ? {who:'', mention} : null;
}

function roleZh(role){
  return {self:'自己', player:'玩家', pup:'同伴', other:'其他', group:'大家'}[role] || '';
}
function partnerOf(m){
  if(m._role==='self'){
    const t=m._to||{};
    return t.kind==='group' ? '大家' : (t.who||'');
  }
  if(m._role==='pup') return m._speaker;
  if(m._role==='player') return '你';
  return '';
}
function toLabel(m){
  const t = m._to;
  if(!t) return '';
  const mt = t.mention ? ('提到「'+t.mention+'」') : '';
  if(!t.who) return mt;
  let s;
  if(t.kind==='player') s = '对「你」说';
  else if(t.kind==='group') s = '对在场的猫说';
  else if(t.kind==='item') s = '对「'+t.who+'」说';
  else if(t.nick) s = '对「'+t.who+'」说（叫的“'+t.nick+'”）';
  else s = '对「'+t.who+'」说' + (t.guess ? '（推断）' : '');
  return mt ? (s + ' · ' + mt) : s;
}

let JOURNEY = null, JOURNEY_NAME = '', JOURNEY_AT = '', JOURNEY_PATH = '';
const JVIEW = { kinds:null, mode:'timeline', filter:null };
const JTYPE_META = {
  see:{cls:'see',label:'看见'},
  mem:{cls:'mem',label:'记住'},

};
function parseJourney(text, name, path){
  const evs=[]; let sess=null;
  String(text||'').split(/\r?\n/).forEach(line=>{
    const t=line.trim(); if(!t || t[0]!=='{') return;
    try{ const o=JSON.parse(t); if(o.t==='session') sess=o; evs.push(o); }catch(e){}
  });
  JOURNEY = evs; JOURNEY_NAME = name||''; JOURNEY_AT = (sess&&sess.at)||''; JOURNEY_PATH = path||''; JVIEW.kinds = null;
  renderSidebar(); renderMain();
  if(typeof renderJourneySource==='function') renderJourneySource();
}
function journeyOf(p){
  if(!JOURNEY || !p) return [];
  // 中途改过名的猫：先用 catId 把所有用过的名字收齐，再按名字捞，
  // 否则只看当前名字会把它改名之前那半场丢掉。
  const ks = new Set([p.name]);
  if(p.key) JOURNEY.forEach(e=>{ if(e.catId===p.key && e.cat) ks.add(e.cat); });
  return JOURNEY.filter(e=> (e.catId && e.catId===p.key) || (e.cat && ks.has(e.cat)));
}
function fmtRel(rt){
  const s=Math.max(0,Math.round(Number(rt)||0));
  return '+'+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}
function defaultKinds(rows){
  return new Set(Object.keys(JTYPE_META).filter(k=> rows.some(e=>e.t===k)));
}
function jRow(e){
  const meta = JTYPE_META[e.t] || {cls:'', label:e.t};
  let body='';
  if(e.t==='see'){
    body = `<b>${esc(e.name||e.type||'')}</b> <span class="jv-sub">${esc(e.type||'')}${e.id?' · '+esc(e.id):''}</span>`
         + (e.memory?`<div class="jv-sub">印象：${esc(e.memory)}</div>`:'');
  } else if(e.t==='mem'){
    body = `${esc(e.text||e.hint||'')}<div class="jv-sub">${esc(e.tag||'')}${e.who?' · 来自 '+esc(e.who):''}${e.to?' · 对 '+esc(e.to):''}${e.imp!=null?' · 重要 '+Number(e.imp).toFixed(2):''}</div>`;
  } else if(e.t==='say'){
    body = `${esc(e.text||'')}<div class="jv-sub">${esc(e.state||'')}${e.to?' · 对 '+esc(e.to):''}${e.target?' · 说到 '+esc(e.target):''}</div>`;
  } else if(e.t==='ai'){
    body = `${esc(e.reply||'')}<div class="jv-sub">${esc(e.state||'')} · ${e.ms}ms${e.ok?'':' · 失败'}${e.note?' · '+esc(e.note):''}</div>`
         + (e.thought?`<div class="jv-sub">当时在想：${esc(e.thought)}</div>`:'');
  } else if(e.t==='rumor'){
    body = `${esc(e.speaker||'')}：「${esc(e.said||'')}」`;
  } else if(e.t==='name'){
    body = `<b>${esc(e.old||'')}</b> → <b>${esc(e.new||'')}</b>`
         + `<div class="jv-sub">${esc(e.from||'')}${e.spoken?'':' · 台词里没说出口'}</div>`;
  } else if(e.t==='nameobj'){
    const by = {player:'玩家',self:'它自己',heard:'听来的'}[e.by] || (e.by||'');
    body = `给 <b>${esc(e.name||'')}</b> 起了名（${esc(e.type||'')}）`
         + (by?`<div class="jv-sub">来源：${esc(by)}</div>`:'');
  } else if(e.t==='verdict'){
    body = `${esc(e.kind)} · 对象 ${esc(e.target||'')} · ${Number(e.stance)>0?'好话':'坏话'}${e.refute?' · 顶回去':''}`
         + `<div class="jv-sub">好感 ${Number(e.aff||0).toFixed(2)}</div>`;
  } else if(e.t==='impr'){
    body = `<b>${esc(e.name||'')}</b> 好感 ${Number(e.aff||0).toFixed(2)} <span class="jv-sub">${esc(e.why||'')}</span>`
         + (e.desc?`<div class="jv-sub">${esc(e.desc)}</div>`:'');
  } else if(e.t==='forget'){
    body = `${esc(e.name||'')} · ${esc(e.what||'')} <span class="jv-sub">好感 ${Number(e.aff||0).toFixed(2)}</span>`;
  } else {
    body = esc(JSON.stringify(e).slice(0,200));
  }
  return `<div class="jv-row ${meta.cls}"><div class="jv-t">${fmtRel(e.rt)}</div><div class="jv-k">${esc(meta.label)}</div><div class="jv-b">${body}</div></div>`;
}
function viewJourney(p){
  if(!JOURNEY){
    return `<div class="jv-empty">还没有载入旅程日志。<br>
      模组选项里勾上「Write journey log (logs/)」，玩一会儿，日志会写进
      <span class="mono">模组目录/logs/journey-*.jsonl</span>。<br>
      用 <span class="mono">python memory_extract.py --serve</span> 启动时，本页会自动读最新那份；
      也可以点右上角「一键载入」，一次把记忆和最新日志都读进来。</div>`;
  }
  const all = journeyOf(p);
  if(!all.length){
    return `<div class="jv-empty">这份日志里没有「${esc(p.name)}」的记录。<br>（日志开始记录的时候，它可能还没出生。）</div>`;
  }
  const rows = filteredJourney(p, all);

  const mode = JVIEW.mode === 'dialogue' ? 'dialogue' : 'timeline';
  const bar = `<div class="jv-bar">
      <span class="chip mono">${esc(JOURNEY_NAME)}</span>
      <button class="jv-chip${mode==='timeline'?' on':''}" data-jm="timeline">分角色时间线</button>
      <button class="jv-chip${mode==='dialogue'?' on':''}" data-jm="dialogue">对话</button>
      ${JVIEW.filter ? `<span class="chip warn">只看「${esc(JVIEW.filter)}」<button class="x" data-jf="">✕</button></span>` : ''}
    </div>`;

  return bar + (mode === 'dialogue' ? viewDialogue(p, rows) : viewJourneyTimeline(p, rows));
}

/* ---------- 模式一：分角色时间线（原始事件流） ---------- */
function viewJourneyTimeline(p, rows){
  const kinds = JVIEW.kinds || defaultKinds(rows);
  const shown = rows.filter(e=> kinds.has(e.t));
  const chips = Object.keys(JTYPE_META).map(k=>{
    const n = rows.filter(e=>e.t===k).length;
    if(!n) return '';
    return `<button class="jv-chip${kinds.has(k)?' on':''}" data-jk="${k}">${JTYPE_META[k].label} ${n}</button>`;
  }).join('');

  return `<div class="jv-bar">
      <span class="chip">本猫事件 ${rows.length}</span>
      ${chips}
      <button class="jv-chip" data-jk="all">全选</button>
    </div>
    <div class="jv-list">${shown.map(jRow).join('')}</div>`;
}

/* ---------- 模式二：对话（谁说的 / 在想什么） ---------- */
const DLG_GAP = 15;                                  // 秒：超过这个间隔算另一段
const DLG_RANK = { note:0, inner:0.5, think:1, me:2, them:3 };  // 同一句话撞车时谁说了算

function normText(x){
  return String(x||'').replace(/[\s，。、！？…~—·,\.!\?;:"'“”‘’（）()\[\]<>《》\-]/g,'');
}

/* 把事件流压成"轮"：对方说的、我在想的、我说出口的，另加零散的账目注脚 */
function dlgItems(rows){
  const mine = new Set();
  const names = new Set();
  rows.forEach(e=>{
    if(e.cat) names.add(e.cat);                                  // 这只猫用过的所有名字
    if(e.t==='say' && e.text) mine.add(normText(e.text));
  });

  const items = [];
  rows.forEach(e=>{
    if(e.t==='say'){
      if(e.text) items.push({role:'me', text:e.text, at:e.rt, state:e.state||'', to:e.to||''});
    } else if(e.t==='mem'){
      const t = e.text || '';
      if(!t) return;
      // kind：0 对方开口（玩家说）1 纯事件没有台词 2 自己的台词 3 同伴的台词
      // 老日志没有 kind，才退回"文本比对"
      let role;
      if(e.kind === 1) return;
      else if(e.kind === 2) role = mine.has(normText(t)) ? 'me' : 'inner';
      else if(e.kind === 0 || e.kind === 3) role = 'them';
      else {
        // 老日志：没有说话人的一定是事件（"我看见光鼠…"），不是谁说的话
        if(!e.who) return;
        if(names.has(e.who)) role = mine.has(normText(t)) ? 'me' : 'inner';
        else role = 'them';
      }

      items.push({role: role, text:t, at:e.rt, tag:e.tag||'', who:e.who||''});
    } else if(e.t==='ai'){
      items.push({role:'think', text:e.thought||'', reply:e.reply||'', at:e.rt,
                  state:e.state||'', ms:e.ms, ok:e.ok});
    } else if(e.t==='name' || e.t==='nameobj' || e.t==='verdict'){
      items.push({role:'note', text:'', at:e.rt, kind:e.t, e:e});
    }
  });
  return items;
}

function dlgBlocks(items){
  const blocks = [];
  let cur = null;

  items.forEach(it=>{
    const fresh = !cur
      || (it.at - cur.last > DLG_GAP)
      || (it.role === 'them' && cur.hasMe)                       // 对方又开口 = 上一轮说完了
      || (it.role === 'them' && cur.lastThem && it.who            // 换人说话 = 另一段
          && it.who !== cur.lastThem);
    if(fresh){
      cur = { at: it.at, last: it.at, hasMe:false, hasThem:false,
              lastThem:'', map:new Map(), order:[] };
      blocks.push(cur);
    }
    cur.last = Math.max(cur.last, it.at);
    if(it.role === 'me') cur.hasMe = true;
    if(it.role === 'them'){ cur.hasThem = true; if(it.who) cur.lastThem = it.who; }

    if(it.role === 'note'){ cur.order.push(it); return; }

    // 同一句话常常出现三遍：想了一遍、记了一条、说出口又一条。
    // 这里按文本去重，只留一条，身份取最高的那个（对方说的 > 我说的 > 想的）。
    const key = normText(it.text) || normText(it.reply);
    if(!key) return;

    const hit = cur.map.get(key);
    if(hit){
      if((DLG_RANK[it.role]||0) > (DLG_RANK[hit.role]||0)){
        hit.role = it.role;
        if(!hit.text && it.text) hit.text = it.text;
      }
      if(it.role === 'them' && it.who) hit.who = it.who;
      if(it.role === 'me' && !hit.state) hit.state = it.state;
      return;
    }

    // "想法"里的回复正文跟"我说出口"是同一句，只留思考那一行
    cur.map.set(key, it);
    cur.order.push(it);
  });

  // 全是注脚的段（比如单独一条取名）也留着，但把空段扔掉
  return blocks.filter(b=> b.order.some(it=> it.role !== 'note'));
}

function dlgNote(it){
  const e = it.e || {};
  if(it.kind === 'name')
    return `<div class="dlg-note">取名 ${esc(e.old||'—')} → ${esc(e.new||'')}</div>`;

  const k = e.kind || '';
  let label = '传闻';
  if(k === 'adopt') label = e.stance > 0 ? '听信好话' : '听信坏话';
  else if(k === 'reject') label = '不认同';
  else if(k === 'about') label = e.stance > 0 ? '被夸' : '被说坏话';
  return `<div class="dlg-note">${esc(label)} · ${esc(e.target || '')}${e.refute ? ' · 顶回去' : ''}</div>`;
}

function viewDialogue(p, rows){
  const items = dlgItems(rows);
  const blocks = dlgBlocks(items);
  if(!blocks.length) return `<div class="jv-empty">这份日志里还没有能读成对话的内容。</div>`;

  const html = blocks.map(b=>{
    const body = b.order.map(it=>{
      if(it.role === 'note') return dlgNote(it);

      if(it.role === 'think'){
        const meta = [it.state, it.ms ? it.ms + 'ms' : '', it.ok === false ? '失败' : '']
          .filter(Boolean).join(' · ');
        return `<div class="dlg-th">${esc(it.text || '（没有留下想法）')}
                  <span class="dlg-meta">${esc(meta)}</span></div>`;
      }

      if(it.role === 'inner'){
        return `<div class="dlg-inner">· ${esc(it.text)}</div>`;
      }

      if(it.role === 'them'){
        return `<div class="dlg-turn them">
                  <span class="dlg-who">${esc(it.who || '对方')}</span>
                  <div class="dlg-bub">${esc(it.text)}</div>
                </div>`;
      }

      return `<div class="dlg-turn me">
                <div class="dlg-bub">${esc(it.text)}</div>
                <span class="dlg-who">${esc(p.name)}</span>
              </div>`;
    }).join('');

    const who = b.hasThem ? '记忆对话' : '记忆独白';
    return `<div class="dlg">
              <div class="dlg-h"><span>${fmtRel(b.at)}</span><span>${who}</span></div>
              <div class="dlg-body">${body}</div>
            </div>`;
  }).join('');

  return `<div class="jv-bar"><span class="chip">${blocks.length} 段</span>
      <span class="jv-hint">同一句话只留一条（想过的 / 记住的 / 说出口的）</span></div>
    <div class="dlg-list">${html}</div>`;
}

async function fetchJourney(){
  try{
    const r = await fetch('api/journey', {cache:'no-store'});
    if(!r.ok) return false;
    const j = await r.json();
    if(!j || !j.ok) return false;
    // 服务端每次都按 memories.json 的位置现找最新一份，这里跟着更新来源显示
    JSRC.mode='server'; JSRC.name = j.name || ''; JSRC.path = j.path || '';
    JSRC.lastModified = (j.mtime||0)*1000; JSRC.error='';
    parseJourney(j.text, j.name, j.path);
    if(typeof renderJourneySource==='function') renderJourneySource();
    return true;
  }catch(e){ return false; }
}

/* ============================================================ 日志对话（旅程日志的对话化重排） */
/* 事件与"某个对象"是否相关（印象跳转筛选用） */
function evtMatchFilter(e, name){
  if(!name) return true;
  const n = String(name);
  const hit = (s)=> s && String(s).indexOf(n) >= 0;
  switch(e.t){
    case 'see': return hit(e.name) || hit(e.type);
    case 'impr': return hit(e.name);
    case 'forget': return hit(e.name);
    case 'verdict': return hit(e.target);
    case 'name': return hit(e.old) || hit(e.new);
    case 'nameobj': return hit(e.name) || hit(e.type);
    case 'rumor': return hit(e.speaker) || hit(e.said);
    default: return hit(e.text) || hit(e.target) || hit(e.thought) || hit(e.reply);
  }
}
function filteredJourney(p, rows){
  const f = JVIEW.filter;
  if(!f) return rows;
  return rows.filter(e=> evtMatchFilter(e, f));
}

/* 一段对话的话题：从这段里的第一个"有说法"的事件里猜 */
function topicOf(items){
  for(const it of items){
    if(it.role === 'them') return it.text;
    if(it.role === 'think' && it.state) return it.state;
    if(it.role === 'me') return it.text;
  }
  return '';
}
function topicLabel(t){
  if(!t) return '';
  return t.length > 16 ? t.slice(0,16) + '…' : t;
}

/* 渲染一条"事件标记"（写入记忆 / 产生印象 / 遗忘） */
function jdMark(e){
  if(e.t === 'mem'){
    const t = e.text || e.hint || '';
    if(!t) return '';
    return `<div class="jd-mark mem">写入记忆，内容：${esc(t)}</div>`;
  }
  if(e.t === 'impr'){
    const why = e.why ? `（${esc(e.why)}）` : '';
    return `<div class="jd-mark impr">产生印象，对象：${esc(e.name||'')}，内容：${esc(e.desc||'')}${why}</div>`;
  }
  if(e.t === 'forget'){
    if(e.name) return `<div class="jd-mark forget">遗忘印象，对象：${esc(e.name)}</div>`;
    const t = (e.what || '').replace(/^遗忘记忆：|^淡忘记忆：/, '');
    return `<div class="jd-mark forget">遗忘记忆，内容：${esc(t||'')}</div>`;
  }
  if(e.t === 'verdict'){
    const k = e.kind || '';
    let label = '传闻';
    if(k === 'adopt') label = e.stance > 0 ? '听信好话' : '听信坏话';
    else if(k === 'reject') label = '不认同';
    else if(k === 'about') label = e.stance > 0 ? '被夸' : '被说坏话';
    return `<div class="jd-mark verdict">${esc(label)} · ${esc(e.target||'')}</div>`;
  }
  if(e.t === 'name'){
    return `<div class="jd-mark name">取名 ${esc(e.old||'—')} → ${esc(e.new||'')}</div>`;
  }
  if(e.t === 'nameobj'){
    const by = {player:'玩家',self:'它自己',heard:'听来的'}[e.by] || (e.by||'');
    return `<div class="jd-mark name">给东西起名 ${esc(e.name||'')}（${esc(e.type||'')}）${by?' · 来源='+by:''}</div>`;
  }
  return '';
}

/* 把对话事件和标记事件按时间穿插进一段 */
function jdBlockBody(p, evs){
  const mine = new Set();
  const names = new Set();
  const spoken = new Set();   // 已经说出口的话（say 的规范化文本）
  evs.forEach(e=>{
    if(e.cat) names.add(e.cat);
    if(e.t==='say' && e.text){ mine.add(normText(e.text)); spoken.add(normText(e.text)); }
  });

  const out = [];          // 顺序渲染的条目
  const seenText = new Map();  // 文本去重

  evs.forEach(e=>{
    if(e.t === 'mem'){
      const t = e.text || '';
      let role;
      if(e.kind === 1){ out.push({mk:'mem', e}); return; }
      else if(e.kind === 2) role = spoken.has(normText(t)) ? 'me' : 'inner';
      else if(e.kind === 0 || e.kind === 3) role = 'them';
      else {
        if(!e.who){ out.push({mk:'mem', e}); return; }
        if(names.has(e.who)) role = spoken.has(normText(t)) ? 'me' : 'inner';
        else role = 'them';
      }
      const key = normText(t);
      // 已经说出口的话（say 会渲染成气泡），"写入记忆"里同一句不再重复
      if(key && spoken.has(key)) return;
      if(key && seenText.has(key)) return;
      if(key) seenText.set(key, role);
      out.push({role, text:t, who:e.who||'', state:e.tag||''});
    }
    else if(e.t === 'say'){
      if(!e.text) return;
      const key = normText(e.text);
      if(key && seenText.has(key)) return;   // 同一句说两次只留一条
      if(key) seenText.set(key, 'me');
      out.push({role:'me', text:e.text, who:'', state:e.state||''});
    }
    else if(e.t === 'ai'){
      const key = normText(e.reply);
      // 这句话已经说出口了 → ai 只留"内心独白"，reply 不单独渲染（say 会出气泡）
      const alreadySpoken = key && spoken.has(key);
      if(alreadySpoken){
        if(!e.thought) return;
        out.push({role:'think', text:e.thought||'', state:e.state||'', ms:e.ms, ok:e.ok});
        return;
      }
      if(key && seenText.has(key)) return;
      if(key) seenText.set(key, 'think');
      out.push({role:'think', text:e.thought||'', reply:e.reply||'', state:e.state||'', ms:e.ms, ok:e.ok});
    }
    else if(e.t === 'impr' || e.t === 'forget' || e.t === 'verdict' || e.t === 'name' || e.t === 'nameobj'){
      out.push({mk:e.t, e});
    }
  });

  return out.map(it=>{
    if(it.mk) return jdMark(it.e);
    if(it.role === 'think'){
      const meta = [it.state, it.ms ? it.ms+'ms' : '', it.ok===false?'失败':''].filter(Boolean).join(' · ');
      return `<div class="dlg-th">${esc(it.text || '（没有留下想法）')}<span class="dlg-meta">${esc(meta)}</span></div>`;
    }
    if(it.role === 'inner') return `<div class="dlg-inner">· ${esc(it.text)}</div>`;
    if(it.role === 'them'){
      return `<div class="dlg-turn them"><span class="dlg-who">${esc(it.who||'对方')}</span><div class="dlg-bub">${esc(it.text)}</div></div>`;
    }
    return `<div class="dlg-turn me"><div class="dlg-bub">${esc(it.text)}</div><span class="dlg-who">${esc(p.name)}</span></div>`;
  }).join('');
}

/* 按时间把事件切成段：间隔 > DLG_GAP，或对方换人 */
function jdSegments(p, rows){
  const names = new Set([p.name]);
  if(p.key) JOURNEY.forEach(e=>{ if(e.catId===p.key && e.cat) names.add(e.cat); });

  const segs = [];
  let cur = null, lastThem = '';
  rows.forEach(e=>{
    // 对方开口：玩家说（kind=0）或同伴说（kind=3）；老日志没 kind 就看 who 是不是别人
    const isThem = e.t==='mem' && (e.kind===0 || e.kind===3 || (e.who && !names.has(e.who)));
    const at = e.rt;
    const fresh = !cur || (at - cur.last > DLG_GAP)
      || (isThem && cur.lastThem && e.who && e.who !== cur.lastThem);
    if(fresh){ cur = { at, last:at, lastThem:'', evs:[] }; segs.push(cur); }
    cur.last = Math.max(cur.last, at);
    if(isThem && e.who){ cur.lastThem = e.who; }
    cur.evs.push(e);
  });
  return segs;
}

function viewJourneyDialogue(p){
  if(!JOURNEY){
    return `<div class="jv-empty">还没有载入旅程日志。<br>
      模组选项里勾上「Write journey log (logs/)」，玩一会儿，日志会写进
      <span class="mono">模组目录/logs/journey-*.jsonl</span>。<br>
      用 <span class="mono">python memory_extract.py --serve</span> 启动时，本页会自动读最新那份；
      也可以点右上角「一键载入」，一次把记忆和最新日志都读进来。</div>`;
  }
  const all = journeyOf(p);
  if(!all.length){
    return `<div class="jv-empty">这份日志里没有「${esc(p.name)}」的记录。<br>（日志开始记录的时候，它可能还没出生。）</div>`;
  }
  const rows = filteredJourney(p, all);

  const bar = `<div class="jv-bar">
    <span class="chip mono">${esc(JOURNEY_NAME)}</span>
    ${JVIEW.filter ? `<span class="chip warn">只看「${esc(JVIEW.filter)}」<button class="x" data-jf="">✕</button></span>` : ''}
    <span class="jv-hint">按猫崽记得的对话重排：气泡是谁说了什么、紫条是内心独白、灰条是账目</span>
  </div>`;

  const segs = jdSegments(p, rows);
  if(!segs.length) return bar + `<div class="jv-empty">筛选后没有「${esc(JVIEW.filter)}」相关的内容。</div>`;

  const html = segs.map(sg=>{
    const topic = topicLabel(topicOf(jdItemsForTopic(sg.evs)));
    const head = `<div class="jd-head">------- 对话开始${topic?'，话题：'+esc(topic):''} ---------</div>`;
    return `<div class="dlg">${head}<div class="dlg-body">${jdBlockBody(p, sg.evs)}</div></div>`;
  }).join('');

  return bar + `<div class="dlg-list">${html}</div>`;
}
/* 抽一段里能用来猜话题的条目 */
function jdItemsForTopic(evs){
  const arr = [];
  evs.forEach(e=>{
    if(e.t==='say' && e.text) arr.push({role:'me', text:e.text});
    else if(e.t==='mem' && e.text) arr.push({role:'them', text:e.text});
    else if(e.t==='ai' && e.thought) arr.push({role:'think', state:e.state, text:e.thought});
  });
  return arr;
}

function renderMain(){
  const p = pup();
  const m = $('#main');
  if(!p){ m.innerHTML = `<div id="empty"><div class="big">还没有载入记忆</div><p>拖入整个「Noisy Pup-AI」文件夹，或点右上角「一键载入」。</p><button class="btn primary" id="btnSample">查看示例数据</button></div>`; $('#btnSample').onclick = ()=>loadSample(); return; }

  const tags = [...new Set(p.mem.map(x=>x.EventTag).filter(Boolean))].sort();
  if(F.tag!=='all' && !tags.includes(F.tag)) F.tag='all';

  const strengthAvg = p.mem.length ? p.mem.reduce((a,b)=>a+Number(b.Strength||0),0)/p.mem.length : 0;
  const recall = p.mem.reduce((a,b)=>a+Number(b.RecallCount||0),0);

  const hero = `
  <div class="hero">
    <div class="hero-top">
      <div class="hero-ava">${esc(initials(p.name))}</div>
      <div style="min-width:0">
        <h2>${esc(p.name)}
          <span class="chip mono">${esc(p.key)}</span>
          <span class="chip a">${esc(nameSourceLabel(p.nameSource))}</span>
        </h2>
        <div class="line2">
          <span class="chip t">${esc(p.speciesZh)}${p.species&&p.species!==p.speciesZh?' · '+esc(p.species):''}</span>
          <span class="chip" style="border-color:${emoColor(p.emotion)}33;color:${emoColor(p.emotion)}">
            <span class="emod" style="background:${emoColor(p.emotion)}"></span>${esc(p.emotion||'无情绪')}${p.emoAge!=null?' · '+fmtAge(p.emoAge):''}
          </span>
          <span class="chip mono">首次 ${fmtTick(p.firstTick)}</span>
          <span class="chip mono">最近 ${fmtTick(p.lastTick)}</span>
        </div>
      </div>
      <div class="hero-actions">
        <button class="btn sm" data-exp="md">导出 Markdown</button>
        <button class="btn sm" data-exp="csv">导出 CSV</button>
        <button class="btn sm" data-exp="json">导出 JSON</button>
        <button class="btn sm" data-exp="txt">导出对话 TXT</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">长期记忆</div><div class="v">${p.mem.length}<small>条</small></div></div>
      <div class="stat"><div class="k">关系印象</div><div class="v">${p.imps.length}<small>个</small></div></div>
      <div class="stat"><div class="k">平均强度</div><div class="v">${strengthAvg.toFixed(2)}</div></div>
      <div class="stat"><div class="k">累计召回</div><div class="v">${recall}<small>次</small></div></div>
      <div class="stat"><div class="k">最近台词</div><div class="v">${p.lines.length}<small>句</small></div></div>
    </div>
  </div>`;

  const tabs = `
  <div class="tabs">
    ${tabBtn('overview','概览','')}
    ${tabBtn('timeline','记忆时间线', p.mem.length)}
    ${tabBtn('chat','记忆对话', p.mem.filter(x=>x.Text).length)}
    ${tabBtn('impressions','印象与关系', p.imps.length)}
    ${tabBtn('journey','旅程日志', JOURNEY?journeyOf(p).length:'')}
    ${tabBtn('jdialogue','日志对话', JOURNEY?journeyOf(p).length:'')}
    ${tabBtn('raw','原始数据','')}
  </div>`;

  let body='';
  if(TAB==='overview') body = viewOverview(p,tags);
  else if(TAB==='timeline') body = viewTimeline(p,tags);
  else if(TAB==='chat') body = viewChat(p);
  else if(TAB==='impressions') body = viewImpressions(p);
  else if(TAB==='journey') body = viewJourney(p);
  else if(TAB==='jdialogue') body = viewJourneyDialogue(p);
  else body = viewRaw(p);

  m.innerHTML = hero + tabs + body;

  m.querySelectorAll('.tab').forEach(n=> n.onclick = ()=>{ TAB=n.dataset.t; renderMain(); });
  m.querySelectorAll('[data-jm]').forEach(n=> n.onclick = ()=>{
    JVIEW.mode = n.dataset.jm; JVIEW.kinds = null; renderMain();
  });
  m.querySelectorAll('[data-jk]').forEach(n=> n.onclick = ()=>{
    const k = n.dataset.jk;
    const rows = journeyOf(p);
    if(k==='all'){ JVIEW.kinds = defaultKinds(rows); }
    else{
      const set = new Set(JVIEW.kinds || defaultKinds(rows));
      if(set.has(k)) set.delete(k); else set.add(k);
      JVIEW.kinds = set;
    }
    renderMain();
  });
  // 清除对象筛选（✕）
  m.querySelectorAll('[data-jf]').forEach(n=> n.onclick = ()=>{
    JVIEW.filter = null; renderMain();
  });
  // 印象标签：跳转到旅程日志，只看这个对象
  m.querySelectorAll('[data-im]').forEach(n=> n.onclick = ()=>{
    JVIEW.filter = n.dataset.im;
    TAB = 'journey';
    renderMain();
  });
  m.querySelectorAll('[data-exp]').forEach(n=> n.onclick = ()=> exportPup(p, n.dataset.exp));
  const cr=$('#copyRaw'); if(cr) cr.onclick = ()=>{
