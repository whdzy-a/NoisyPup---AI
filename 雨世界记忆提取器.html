  };
  const dr=$('#dlRaw'); if(dr) dr.onclick = ()=>{
    const o={}; o[p.key]=p.raw;
    download(p.name+'_原始记录.json', JSON.stringify(o,null,2), 'application/json');
    toast('已下载原始记录');
  };
  m.querySelectorAll('[data-cm]').forEach(n=> n.onclick = ()=>{ F.chatMode = n.dataset.cm; renderMain(); });
  bindTimeline(p);
}
function tabBtn(id,label,cnt){
  return `<button class="tab${TAB===id?' on':''}" data-t="${id}">${label}${cnt!==''?`<span class="cnt">${cnt}</span>`:''}</button>`;
}

/* ---------- 概览 ---------- */
function viewOverview(p,tags){
  const tagCount = {};
  p.mem.forEach(x=>{ const k=x.EventTag||'（无）'; tagCount[k]=(tagCount[k]||0)+1; });
  const tagRows = Object.entries(tagCount).sort((a,b)=>b[1]-a[1]);
  const maxTag = Math.max(1,...tagRows.map(r=>r[1]));

  const kindCount = [0,0,0,0];
  p.mem.forEach(x=>{ if(kindCount[x.Kind]!=null) kindCount[x.Kind]++; });

  const lines = p.lines.slice().reverse();
  const counters = Object.entries(p.counters||{});

  return `
  <div class="panel">
    <h3>这是什么猫 <span class="tag">profile</span></h3>
    <div class="kv">
      <div class="row"><span class="k">存档键</span><span class="v mono">${esc(p.key)}</span></div>
      <div class="row"><span class="k">物种</span><span class="v">${esc(p.speciesZh)} <span class="mono" style="color:var(--muted);font-weight:400">${esc(p.species)}</span></span></div>
      <div class="row"><span class="k">当前情绪</span><span class="v" style="color:${emoColor(p.emotion)}">${esc(p.emotion||'—')}</span></div>
      <div class="row"><span class="k">情绪持续</span><span class="v">${p.emoAge!=null?fmtSpan(p.emoAge):'—'}</span></div>
      <div class="row"><span class="k">首次进档</span><span class="v mono">${fmtTick(p.firstTick)}</span></div>
      <div class="row"><span class="k">最后一次说话</span><span class="v mono">${fmtTick(p.lastTick)}</span></div>
      <div class="row"><span class="k">命名来源</span><span class="v">${esc(nameSourceLabel(p.nameSource))}${NAME_SOURCES[p.nameSource]?' · '+(NAME_SOURCES[p.nameSource].desc||''):''}</span></div>
      <div class="row"><span class="k">计数器</span><span class="v">${counters.length? counters.map(([k,v])=>`${esc(k)} ${v}`).join(' · ') : '空'}</span></div>
    </div>
  </div>

  <div class="panel">
    <h3>记忆构成 <span class="tag">memory mix</span></h3>
    <div class="bars">
      ${tagRows.map(([t,n])=>`<div class="bar-row">
        <span class="lb" title="${esc(t)}">${esc(tagDesc(t))}</span>
        <span class="bar-track"><span class="bar-fill" style="width:${Math.round(n/maxTag*100)}%"></span></span>
        <span class="n">${n}</span></div>`).join('') || '<div style="color:var(--muted);font-size:12.5px">没有长期记忆</div>'}
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
      ${KIND.map((k,i)=>`<span class="chip ${k.cls}" title="${esc(k.label)}">${esc(k.short)} ${kindCount[i]}</span>`).join('')}
      <span class="chip">标签种类 ${tags.length}</span>
    </div>
  </div>

  ${(()=>{
    const pt={};
    p.mem.forEach(m=>{
      if(!(m.Text||'').trim()) return;
      const who = partnerOf(m); if(!who) return;
      const d = pt[who] || (pt[who]={self:0,heard:0,last:null});
      if(m._role==='self') d.self++; else d.heard++;
      if(!d.last || Number(m.AgeSeconds) < Number(d.last.AgeSeconds)) d.last = m;
    });
    const rows = Object.entries(pt).sort((a,b)=> (b[1].self+b[1].heard)-(a[1].self+a[1].heard));
    if(!rows.length) return '';
    return `<div class="panel">
    <h3>和谁说过话 <span class="tag">partners</span></h3>
    <div class="hintline">「说」＝它对这个对象说了几句，「听」＝对方对它说了几句。对着物品说话时，对象直接取自存档（Addressee）；其余是按上下文推断的。</div>
    ${rows.map(([who,d])=>`<div style="display:flex;gap:12px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line2);font-size:12.5px">
      <span style="font-weight:650;min-width:84px">${esc(who)}</span>
      <span class="chip t" style="font-size:11px">说 ${d.self}</span>
      <span class="chip v" style="font-size:11px">听 ${d.heard}</span>
      <span style="flex:1;text-align:right;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc((d.last.Text||'').slice(0,28))}</span>
    </div>`).join('')}
  </div>`;
  })()}

  <div class="panel">
    <h3>最近说的六句 <span class="tag">recent lines</span></h3>
    <div class="hintline">存档里保留的最后几句话，倒序排列（最后一句在最上面）。</div>
    ${lines.length? lines.map((l,i)=>`<div class="quote">${esc(l)}</div>`).join('') : '<div style="color:var(--muted);font-size:12.5px">还没有台词记录</div>'}
  </div>`;
}

/* ---------- 时间线 ---------- */
function filtered(p){
  const q = F.q.trim().toLowerCase();
  let arr = p.mem.filter(x=>{
    if(!F.kinds.has(Number(x.Kind))) return false;
    if(F.cat!=='all' && Number(x.Category)!==Number(F.cat)) return false;
    if(F.tag!=='all' && (x.EventTag||'')!==F.tag) return false;
    if(!q) return true;
    const hay = [x.Text,x.Hint,x.SpeakerName,x.EventTag,tagDesc(x.EventTag)].join(' ').toLowerCase();
    return hay.includes(q);
  });
  const cmp = {
    new: (a,b)=> Number(a.AgeSeconds)-Number(b.AgeSeconds),
    old: (a,b)=> Number(b.AgeSeconds)-Number(a.AgeSeconds),
    strong: (a,b)=> Number(b.Strength||0)-Number(a.Strength||0),
    imp: (a,b)=> Number(b.Importance||0)-Number(a.Importance||0),
    sal: (a,b)=> Number(b.Salience||0)-Number(a.Salience||0),
    recall:(a,b)=> Number(b.RecallCount||0)-Number(a.RecallCount||0)
  }[F.sort] || null;
  if(cmp) arr = arr.slice().sort(cmp);
  return arr;
}
function viewTimeline(p,tags){
  const arr = filtered(p);
  return `
  <div class="toolbar">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="fq" placeholder="搜台词、提示、标签、说话人…" value="${esc(F.q)}">
    </label>
    <div class="kind-chips" id="kindChips">
      ${KIND.map((k,i)=>`<button class="kchip${F.kinds.has(i)?' on':''}" data-k="${i}">${esc(k.short)}</button>`).join('')}
    </div>
    <select id="fcat">
      <option value="all">全部分类</option>
      ${CAT.map((c,i)=>`<option value="${i}"${String(F.cat)===String(i)?' selected':''}>${esc(c)}</option>`).join('')}
    </select>
    <select id="ftag">
      <option value="all">全部标签</option>
      ${tags.map(t=>`<option value="${esc(t)}"${F.tag===t?' selected':''}>${esc(tagDesc(t))}（${esc(t)}）</option>`).join('')}
    </select>
    <select id="fsort">
      ${[['new','最新在前'],['old','最旧在前'],['strong','强度最高'],['imp','重要度最高'],['sal','显著度最高'],['recall','被想起最多']]
        .map(([v,l])=>`<option value="${v}"${F.sort===v?' selected':''}>${l}</option>`).join('')}
    </select>
    <div class="tb-right">
      <label style="display:flex;align-items:center;gap:5px;cursor:pointer">
        <input type="checkbox" id="fexp" ${F.useFilterExport?'checked':''}>导出套用筛选
      </label>
      <span style="color:var(--ink2)">${arr.length} / ${p.mem.length} 条</span>
    </div>
  </div>
  <div class="mem-list" id="memList">
    ${arr.length? arr.map(m=>memCard(m,p)).join('') : '<div class="empty-list">当前筛选条件下没有记忆</div>'}
  </div>`;
}
function memCard(m, p){
  const k = KIND[Number(m.Kind)] || {short:'未知',cls:'k1'};
  const t = m.EventTag||'';
  const type = tagType(t);
  const att = attitudeOf(type);
  const txt = (m.Text||'').trim();
  const isOwn = Number(m.Kind)===2;
  const st = Number(m.Strength||0);
  return `<div class="mem">
    <div class="mem-head">
      <span class="badge ${k.cls}" title="${esc(k.label||'')}">${esc(k.short)}</span>
      <span class="tagtxt">${esc(tagDesc(t))}</span>
      <span class="tagraw">${esc(t||'—')}</span>
      <span class="age">${fmtAge(m.AgeSeconds)}</span>
    </div>
    ${txt ? `<div class="body${isOwn?' own':''}">${isOwn?'':`<span class="spkname" style="color:${speakerColor(m._role,m._speaker,p.name)}">${esc(m._speaker)}：</span>`}${esc(txt)}</div>`
          : `<div class="body empty">（这一条只留了事件，没有台词）</div>`}
    ${m.Hint ? `<div class="hint">${esc(m.Hint)}</div>` : ''}
    ${att && !txt ? `<div class="ref">猫崽对这个东西的参考看法：<b>${esc(att.f)}</b>（强度 ${att.s}/5）——「${esc(att.v)}」</div>` : ''}
    <div class="mem-foot">
      <span class="mf">说话人 <b style="color:${speakerColor(m._role,m._speaker,p.name)}">${esc(m._speaker||'—')}</b>${m._role!=='self'?`<span style="color:var(--muted)">（${roleZh(m._role)}）</span>`:''}</span>
      ${m._to&&m._to.who?`<span class="mf">${esc(toLabel(m))}</span>`:''}
      <span class="mf">强度 <span class="mbar${st<0.4?' warn':''}"><i style="width:${Math.round(st*100)}%"></i></span> <span class="mono">${num(st)}</span></span>
      <span class="mf">重要 <span class="mono">${num(m.Importance)}</span></span>
      <span class="mf">显著 <span class="mono">${num(m.Salience)}</span></span>
      <span class="mf">召回 <span class="mono">${Number(m.RecallCount||0)}</span> 次</span>
      <span class="mf">类别 ${esc(CAT[Number(m.Category)]||'—')}</span>
      <span class="idx" style="margin-left:auto">#${m._i+1}</span>
    </div>
  </div>`;
}
function bindTimeline(p){
  const fq = $('#fq');
  if(fq){
    fq.oninput = ()=>{ F.q=fq.value; const arr=filtered(p); $('#memList').innerHTML = arr.length? arr.map(m=>memCard(m,p)).join('') : '<div class="empty-list">当前筛选条件下没有记忆</div>'; };
    fq.onkeydown = e=>{ if(e.key==='Escape'){ fq.value=''; F.q=''; fq.oninput(); } };
  }
  document.querySelectorAll('#kindChips .kchip').forEach(b=>{
    b.onclick = ()=>{
      const k = Number(b.dataset.k);
      if(F.kinds.has(k)){ if(F.kinds.size===1) return; F.kinds.delete(k); } else F.kinds.add(k);
      renderMain();
    };
  });
  const fc=$('#fcat'); if(fc) fc.onchange=()=>{ F.cat=fc.value; renderMain(); };
  const ft=$('#ftag'); if(ft) ft.onchange=()=>{ F.tag=ft.value; renderMain(); };
  const fs=$('#fsort'); if(fs) fs.onchange=()=>{ F.sort=fs.value; renderMain(); };
  const fx=$('#fexp'); if(fx) fx.onchange=()=>{ F.useFilterExport=fx.checked; toast(fx.checked?'导出时将只包含当前筛选结果':'导出时包含全部记忆'); };
}

/* ---------- 对话 ---------- */
function viewChat(p){
  const mode = F.chatMode || 'all';
  const lines = p.mem.filter(x=>(x.Text||'').trim());
  const isPlayer = x => x._role==='player' || (x._to && x._to.kind==='player');
  // "与同伴"＝说话方和听的一方都是猫（同伴说给本猫，或本猫说给同伴）
  const isPup = x => x._role!=='player' && !!x._to && (x._to.kind==='pup' || x._to.kind==='self');
  const cnt = {
    all: lines.length,
    player: lines.filter(isPlayer).length,
    pup: lines.filter(isPup).length,
    silent: p.mem.filter(x=>!(x.Text||'').trim() && x.Hint).length
  };
  const match = x=>{
    const hasText = !!(x.Text||'').trim();
    if(mode==='silent') return !hasText;
    if(!hasText) return false;
    if(mode==='player') return isPlayer(x);
    if(mode==='pup') return isPup(x);
    return true;
  };
  const arr = p.mem.filter(match).slice().sort((a,b)=> Number(b.AgeSeconds)-Number(a.AgeSeconds));
  const parts = [];
  lines.forEach(x=>{ if(!parts.includes(x._speaker)) parts.push(x._speaker); });
  const chip = (k,l)=>`<button class="kchip${mode===k?' on':''}" data-cm="${k}">${l} <span class="c">${cnt[k]}</span></button>`;

  return `
  <div class="panel">
    <h3>对话回放 <span class="tag">by speaker</span></h3>
    <div class="hintline">
      记忆里只存了“谁说的”，没存“说给谁听”。所以这里按说话人分色：<b style="color:#3d6c9e">蓝＝你</b>、<b style="color:#2f6f66">绿＝${esc(p.name)}自己</b>、<b style="color:#5f5590">紫＝同伴</b>。
      “对谁说”是按上下文推的，标「推断」的尤其不确定。
    </div>
    <div class="chatbar">
      ${chip('all','全部')}${chip('player','与玩家')}${chip('pup','与同伴')}${chip('silent','没出声')}
      <span class="chatinfo">说话人：${parts.map(esc).join('、')||'—'}</span>
    </div>
    <div class="chat">
      ${arr.length? arr.map(x=>{
        if(!(x.Text||'').trim()) return `<div class="silent">${esc(x.Hint||'（没出声）')}</div>`;
        const role = x._role || 'self';
        const name = x._speaker || p.name;
        const cls = role==='player' ? 'me' : (role==='self' ? 'own' : 'peer');
        const color = speakerColor(role, name, p.name);
        const to = toLabel(x);
        return `<div class="msg ${cls}">
          <div class="wh" style="background:${color}">${esc(initials(name))}</div>
          <div class="bubwrap">
            <div class="who2"><b style="color:${color}">${esc(name)}</b>${role==='self'?'':`<span>${roleZh(role)}</span>`}${to?`<span class="tochip">${esc(to)}</span>`:''}</div>
            <div class="bub">${esc(x.Text)}
              <div class="meta2"><span>${fmtAge(x.AgeSeconds)}</span><span>${esc(tagDesc(x.EventTag))}</span></div>
            </div>
          </div>
        </div>`;
      }).join('') : '<div class="empty-list">没有符合条件的对话</div>'}
    </div>
  </div>`;
}

/* ---------- 印象 ---------- */
function viewImpressions(p){
  if(!p.imps.length) return `<div class="panel"><h3>印象与关系</h3><div class="empty-list">这只猫还没记住任何对象</div></div>`;
  const arr = p.imps.slice().sort((a,b)=> Math.abs(b._aff)-Math.abs(a._aff) || Number(b.Met||0)-Number(a.Met||0));
  return `
  <div class="panel">
    <h3>印象与关系 <span class="tag">impressions</span></h3>
    <div class="hintline">亲近度 = 初始好感（态度表点数 × 0.04）+ 累计行为 + 最近语气（约 8 分钟衰减），再按「遗忘」标签每枚朝 0 靠 0.1，最后压到 −1 ~ 1。归零后再落一枚标签，这条印象会被删掉；再次见到、被谈起都会撤销全部遗忘标签。名字若已改过，会同时标出现名。</div>
    <div class="imp-grid">
    ${arr.map(im=>{
      const a = im._aff, isYou = im.Type==='Slugcat' || im.Name==='你';
      const att = attitudeOf(im.Type);
      const shown = im._live && im._live!==im.Name ? im.Name+'（现名 '+im._live+'）' : im.Name;
      const target = im._live || im.Name;   // 跳转筛选用的对象名（现名优先）
      const cnt = IMP_FIELDS.filter(([f])=>Number(im[f]||0)>0)
        .map(([f,l])=>`<span class="cnt-chip${IMP_NEG.includes(f)?' neg':''} click" data-im="${esc(target)}" title="在旅程日志里只看「${esc(target)}」">${l} <b>${Number(im[f])}</b></span>`).join('');
      return `<div class="imp">
        <div class="imp-top">
          <div class="ava" style="width:34px;height:34px;border-radius:10px">${esc(initials(im._live||im.Name))}</div>
          <div style="min-width:0;flex:1">
            <div class="nm">${esc(shown)}${isYou?' <span class="chip b" style="font-size:10px">玩家</span>':''}</div>
            <div class="tp">${esc(im.Type||'?')} · ${esc(zhOf(im.Type))} · 见面 ${Number(im.Met||0)} 次</div>
            <div class="tp" style="margin-top:2px">初始 ${im._base>=0?'+':''}${im._base.toFixed(2)}${im._sent?`　最近语气 ${im._sent>0?'+':''}${im._sent.toFixed(2)}`:''}</div>
            ${forgetTags(im)?`<div class="tp" style="margin-top:2px;color:var(--rose)">遗忘 ${forgetTags(im)} 枚（每枚朝 0 靠 0.1）${Math.abs(a)<1e-4?' · 已归零，下一枚就删掉':''}</div>`:''}
          </div>
        </div>
        <div class="aff">
          <div class="aff-top"><span>亲近度</span><span class="mono" style="color:${a<0?'var(--rose)':'var(--teal)'}">${a>0?'+':''}${a.toFixed(2)}</span></div>
          <div class="aff-track"><span class="mid"></span>
            <span class="aff-fill ${a<0?'neg':'pos'}" style="width:${Math.abs(a)*50}%"></span>
          </div>
        </div>
        <div class="mood" style="color:${a<0?'var(--rose)':(a>0.15?'var(--teal)':'var(--ink2)')}">「${esc(mood(im,isYou,im._now))}」</div>
        <div class="desc">它记得：${esc(describeImp(im,isYou))}</div>
        <div class="cnts">${cnt || '<span class="cnt-chip">只有见面记录</span>'}</div>
        ${att? `<div class="ref2"><div class="ttl">参考态度（模组内置）</div><b style="color:#2f6f66">${esc(att.f)}</b> · 强度 ${att.s}/5 · 初始好感 ${attitudeScore(im.Type)} 点 —— 「${esc(att.v)}」</div>`:''}
      </div>`;
    }).join('')}
    </div>
  </div>`;
}

/* ---------- 原始 ---------- */
function viewRaw(p){
  const json = JSON.stringify(p.raw, null, 2);
  return `<div class="panel">
    <h3>原始记录 <span class="tag">raw json</span>
      <span style="margin-left:auto;display:flex;gap:6px">
        <button class="btn sm" id="copyRaw">复制</button>
        <button class="btn sm" id="dlRaw">下载这段</button>
      </span>
    </h3>
    <div class="hintline">就是 memories.json 里 <span class="mono">Pups["${esc(p.key)}"]</span> 这一节的原文。</div>
    <pre class="raw">${esc(json)}</pre>
  </div>`;
}

/* ============================================================ 导出 */
function pad(n){ return String(n).padStart(2,'0'); }
function stamp(){
  const d=new Date();
  return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes());
}
function download(name, content, mime, bom){
  const blob = new Blob([bom?'\uFEFF':'', content], {type:mime||'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
function memRows(p){
  const src = F.useFilterExport ? filtered(p) : p.mem.slice().sort((a,b)=>Number(a.AgeSeconds)-Number(b.AgeSeconds));
  return src;
}
function toCSV(rows, pupName, pupKey){
  const head = ['猫名','存档键','序号','距今秒','距今','类型','分类','标签','标签说明','说话人','角色','对谁说','文本','提示','重要度','显著度','强度','召回次数'];
  const q = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const lines = [head.map(q).join(',')];
  rows.forEach((m,i)=>{
    const k = KIND[Number(m.Kind)];
    lines.push([pupName,pupKey,i+1, Math.round(Number(m.AgeSeconds)||0), fmtAge(m.AgeSeconds),
      (k?k.short:'?'), CAT[Number(m.Category)]||'', m.EventTag||'', tagDesc(m.EventTag),
      m._speaker||m.SpeakerName||'', roleZh(m._role)||'', toLabel(m), (m.Text||'').replace(/\r?\n/g,' '), (m.Hint||'').replace(/\r?\n/g,' '),
      num(m.Importance), num(m.Salience), num(m.Strength), Number(m.RecallCount||0)
    ].map(q).join(','));
  });
  return lines.join('\r\n');
}
function toMD(p){
  const rows = memRows(p);
  const L = [];
  L.push('# '+p.name+' · 记忆导出','');
  L.push('> Noisy Pup-AI 记忆文件解析 · 存档键 `'+p.key+'` · 导出时间 '+new Date().toLocaleString('zh-CN'));
  if(F.useFilterExport && (F.q||F.tag!=='all'||F.cat!=='all'||F.kinds.size<4))
    L.push('> 注意：本次导出应用了界面筛选，共 '+rows.length+' / '+p.mem.length+' 条。');
  L.push('','## 基本信息','');
  L.push('| 项目 | 值 |','|---|---|');
  L.push('| 名字 | '+p.name+' |');
  L.push('| 物种 | '+p.speciesZh+'（'+p.species+'） |');
  L.push('| 命名来源 | '+nameSourceLabel(p.nameSource)+' |');
  L.push('| 当前情绪 | '+(p.emotion||'—')+(p.emoAge!=null?'（持续 '+fmtAge(p.emoAge)+'）':'')+' |');
  L.push('| 首次进档 | '+fmtTick(p.firstTick)+' |');
  L.push('| 最后说话 | '+fmtTick(p.lastTick)+' |');
  L.push('| 长期记忆 | '+p.mem.length+' 条 |');
  L.push('| 关系印象 | '+p.imps.length+' 个 |');
  L.push('');
  const cs = Object.entries(p.counters||{});
  if(cs.length){ L.push('计数器：'+cs.map(([k,v])=>k+'='+v).join('，'),''); }

  L.push('## 印象与关系','');
  if(!p.imps.length) L.push('_还没有任何对象被记住_','');
  p.imps.slice().sort((a,b)=>Math.abs(b._aff)-Math.abs(a._aff)).forEach(im=>{
    const isYou = im.Type==='Slugcat'||im.Name==='你';
    L.push('### '+(im._live&&im._live!==im.Name? im.Name+'（现名 '+im._live+'）':im.Name)+'　`'+im.Type+'`','');
    L.push('- 亲近度：'+(im._aff>0?'+':'')+im._aff.toFixed(2)+'　（'+mood(im,isYou,im._now)+'）');
    L.push('- 初始好感：'+(im._base>0?'+':'')+im._base.toFixed(2)+'　最近语气：'+(im._sent>0?'+':'')+im._sent.toFixed(2));
    L.push('- 它记得：'+describeImp(im,isYou));
    L.push('- 见面 '+Number(im.Met||0)+' 次　最后见到：'+fmtTick(im.LastTick));
    const bits = IMP_FIELDS.filter(([f])=>Number(im[f]||0)>0).map(([f,l])=>l+' '+im[f]);
    if(bits.length) L.push('- 行为计数：'+bits.join('、'));
    const att = attitudeOf(im.Type);
    if(att) L.push('- 参考态度：**'+att.f+'**（'+att.s+'/5）—— 「'+att.v+'」');
    L.push('');
  });

  L.push('## 长期记忆（'+rows.length+' 条）','');
  rows.forEach((m,i)=>{
    const k = KIND[Number(m.Kind)];
    L.push('### '+(i+1)+'. '+(k?k.short:'?')+' · '+tagDesc(m.EventTag)+'　`'+(m.EventTag||'—')+'`','');
    if(m.Text) L.push('> '+m.Text.replace(/\n/g,'\n> '),'');
    else L.push('_（没有台词，只留下了事件）_','');
    if(m.Hint) L.push('提示：'+m.Hint+'','');
    L.push('- 说话人：'+(m._speaker||m.SpeakerName||'—')+(m._role && m._role!=='self' ? '（'+roleZh(m._role)+'）' : '')+(m._to&&m._to.who ? '　'+toLabel(m) : ''));
    L.push('- 时间：'+fmtAge(m.AgeSeconds)+'　强度 '+num(m.Strength)+'　重要 '+num(m.Importance)+'　显著 '+num(m.Salience)+'　召回 '+Number(m.RecallCount||0)+' 次');
    L.push('- 分类：'+(CAT[Number(m.Category)]||'—')+'　存档序号 #'+(m._i+1),'');
    const type = tagType(m.EventTag); const att = attitudeOf(type);
    if(att && !m.Text) L.push('> 参考态度：'+att.f+'（'+att.s+'/5）——「'+att.v+'」','');
  });

  if(p.lines.length){
    L.push('## 最近台词','');
    p.lines.slice().reverse().forEach(l=> L.push('> '+l,''));
  }
  L.push('---','','由「Noisy Pup 记忆提取器」生成');
  return L.join('\n');
}
function toTXT(p){
  const arr = p.mem.filter(x=>x.Text).slice().sort((a,b)=>Number(b.AgeSeconds)-Number(a.AgeSeconds));
  const L = ['# '+p.name+' 对话记录（'+p.key+'）', '> 由早到晚 · 共 '+arr.length+' 句', ''];
  arr.forEach(x=>{
    const who = x._speaker || (Number(x.Kind)===2 ? p.name : (x.SpeakerName||'?'));
    const to = toLabel(x);
    L.push('['+fmtAge(x.AgeSeconds)+'] '+(roleZh(x._role)==='玩家'?'你':who)+'：'+x.Text+(to?'　'+to:''));
    if(x.Hint) L.push('    · '+x.Hint);
  });
  return L.join('\r\n');
}
function exportPup(p, kind){
  const base = p.name.replace(/[\\/:*?"<>|]/g,'_');
  if(kind==='json'){
    const obj = {}; obj[p.key] = p.raw;
    download(base+'_记忆.json', JSON.stringify({Version:DB.Version, Game:DB.Game, Pups:obj}, null, 2), 'application/json');
  } else if(kind==='md'){
    download(base+'_记忆.md', toMD(p), 'text/markdown');
  } else if(kind==='csv'){
    download(base+'_记忆.csv', toCSV(memRows(p), p.name, p.key), 'text/csv', true);
  } else {
    download(base+'_对话.txt', toTXT(p));
  }
  toast('已导出：'+base+'（'+kind.toUpperCase()+'）');
}

/* ---------- 极简 ZIP（store 模式，无压缩） ---------- */
const CRC_TABLE = (()=>{ const t=new Uint32Array(256);
  for(let i=0;i<256;i++){ let c=i; for(let k=0;k<8;k++) c = (c&1)? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[i]=c>>>0; }
  return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = CRC_TABLE[(c^u8[i])&0xFF] ^ (c>>>8); return (c^0xFFFFFFFF)>>>0; }
function buildZip(files){
  const enc = new TextEncoder();
  const parts=[], central=[]; let offset=0;
  const now = new Date();
  const dosTime = ((now.getHours()<<11) | (now.getMinutes()<<5) | (now.getSeconds()>>1)) & 0xFFFF;
  const dosDate = (((now.getFullYear()-1980)<<9) | ((now.getMonth()+1)<<5) | now.getDate()) & 0xFFFF;
  const u16=v=>[v&255,(v>>8)&255], u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>24)&255];
  for(const f of files){
    const name = enc.encode(f.name);
    const data = enc.encode(f.text);
    const crc = crc32(data);
    const lh = [].concat([0x50,0x4b,0x03,0x04], u16(20), u16(0x0800), u16(0), u16(dosTime), u16(dosDate),
      u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0));
    parts.push(new Uint8Array(lh), name, data);
    central.push({name, crc, size:data.length, offset});
    offset += lh.length + name.length + data.length;
  }
  const cdStart = offset; let cdLen = 0;
  const cds=[];
  for(const c of central){
    const ch = [].concat([0x50,0x4b,0x01,0x02], u16(20), u16(20), u16(0x0800), u16(0), u16(dosTime), u16(dosDate),
      u32(c.crc), u32(c.size), u32(c.size), u16(c.name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(c.offset));
    cds.push(new Uint8Array(ch), c.name);
    cdLen += ch.length + c.name.length;
  }
  const eocd = new Uint8Array([].concat([0x50,0x4b,0x05,0x06], u16(0), u16(0), u16(files.length), u16(files.length),
    u32(cdLen), u32(cdStart), u16(0)));
  return new Blob([...parts, ...cds, eocd], {type:'application/zip'});
}
function exportZip(){
  if(!PUPS.length) return;
  const files=[];
  const idx=['# Noisy Pup 记忆归档','','> '+new Date().toLocaleString('zh-CN')+' · '+PUPS.length+' 只猫崽 · '+PUPS.reduce((a,b)=>a+b.mem.length,0)+' 条长期记忆',''];
  PUPS.forEach(p=>{
    const b = p.name.replace(/[\\/:*?"<>|]/g,'_');
    files.push({name:b+'/'+b+'_记忆.md', text:toMD(p)});
    files.push({name:b+'/'+b+'_记忆.csv', text:'\uFEFF'+toCSV(p.mem.slice().sort((x,y)=>Number(x.AgeSeconds)-Number(y.AgeSeconds)),p.name,p.key)});
    files.push({name:b+'/'+b+'_对话.txt', text:'\uFEFF'+toTXT(p)});
    const o={}; o[p.key]=p.raw;
    files.push({name:b+'/'+b+'_原始.json', text:JSON.stringify(o,null,2)});
    idx.push('## '+p.name+'（'+p.key+'）','- 物种：'+p.speciesZh+'　情绪：'+(p.emotion||'—')+'　记忆：'+p.mem.length+' 条　印象：'+p.imps.length+' 个');
    idx.push('- 最近一句：'+(p.lines[p.lines.length-1]||'—'),'');
  });
  files.unshift({name:'00_索引.md', text:idx.join('\n')});
  const blob = buildZip(files);
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='NoisyPup_记忆归档_'+stamp()+'.zip';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),8000);
  toast('已打包 '+files.length+' 个文件（'+PUPS.length+' 只猫崽）');
}

/* ============================================================ 载入 */
let toastTimer=null;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),2400);
}
/* ---------- 数据来源：记住文件 + 自动刷新 ---------- */
const SRC = {
  mode:'none',           // server | handle | pending | snapshot | sample | none
  name:'', path:'',
  handle:null, pendingHandle:null,
  lastModified:0, size:0,
  timer:null, sse:null,
  auto:true, interval:2,
  lastSync:0, error:'', busy:false,
  serverOK:false, serverInfo:null
};
function loadSettings(){
  try{
    const a = localStorage.getItem('noisypup.auto');
    if(a!==null) SRC.auto = a==='1';
    const i = parseInt(localStorage.getItem('noisypup.interval')||'2',10);
    if(i>0) SRC.interval = i;
  }catch(e){}
}
function saveSettings(){
  try{
    localStorage.setItem('noisypup.auto', SRC.auto?'1':'0');
    localStorage.setItem('noisypup.interval', String(SRC.interval));
  }catch(e){}
}

/* 浏览器只允许用「文件句柄」记住路径，句柄存在 IndexedDB 里 */
function idbOpen(){
  return new Promise((res,rej)=>{
    let r; try{ r = indexedDB.open('noisypup-src',1); }catch(e){ return rej(e); }
    r.onupgradeneeded = ()=>{ try{ if(!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv'); }catch(e){} };
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
  });
}
function idbGet(k){
  return idbOpen().then(db=> new Promise((res,rej)=>{
    const q = db.transaction('kv','readonly').objectStore('kv').get(k);
    q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error);
  })).catch(()=>null);
}
function idbSet(k,v){
  return idbOpen().then(db=> new Promise((res,rej)=>{
    const tx = db.transaction('kv','readwrite');
    tx.objectStore('kv').put(v,k);
    tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error);
  })).catch(()=>false);
}
function idbDel(k){
  return idbOpen().then(db=> new Promise((res)=>{
    const tx = db.transaction('kv','readwrite');
    tx.objectStore('kv').delete(k);
    tx.oncomplete=()=>res(true); tx.onerror=()=>res(false);
  })).catch(()=>false);
}

function fmtClock(ts){
  if(!ts) return '—';
  const d = new Date(ts);
  const today = new Date();
  const time = pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  return d.toDateString()===today.toDateString() ? time : (pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+time);
}
function syncAgo(){
  if(!SRC.lastSync) return '未同步';
  const s = Math.round((Date.now()-SRC.lastSync)/1000);
  if(s < 3) return '刚刚同步';
  if(s < 60) return s+' 秒前同步';
  return Math.floor(s/60)+' 分前同步';
}
function isWatching(){
  if(SRC.error) return false;
  return SRC.mode==='server' || (SRC.mode==='handle' && SRC.auto);
}

/* 状态条 + 面板 */
function renderSource(){
  const chip=$('#srcChip'), txt=$('#srcTxt'), sync=$('#srcSync');
  const pupsN = PUPS.length, memN = PUPS.reduce((a,b)=>a+b.mem.length,0);
  chip.classList.toggle('live', isWatching());

  let s = '· 手动';
  if(SRC.error) s = '· 读取异常';
  else if(SRC.mode==='server') s = SRC.auto ? '· 实时' : '· 已暂停';
  else if(SRC.mode==='handle') s = SRC.auto ? ('· 每 '+SRC.interval+' 秒') : '· 已暂停';
  else if(SRC.mode==='pending') s = '· 待恢复';
  else if(SRC.mode==='sample') s = '';
  sync.textContent = s;

  const modeTxt = {server:'本地监视服务（推送）', handle:'已绑定文件（轮询）', pending:'已记住文件，待授权',
                   snapshot:'一次性快照', sample:'内置示例', none:'未载入'}[SRC.mode] || '—';
  const set=(id,v)=>{ const el=$(id); if(el) el.textContent=v; };

  set('#spCount', pupsN ? (pupsN+' 只猫崽 / '+memN+' 条记忆') : '—');

  }
  set('#spMtime', SRC.lastModified ? fmtClock(SRC.lastModified) : '—');
  set('#spSync', SRC.lastSync ? fmtClock(SRC.lastSync)+'（'+syncAgo()+'）' : '—');
  const au=$('#spAuto'), iv=$('#spInterval');
  if(au) au.checked = SRC.auto;

  const tip=$('#spTip');

      : '拖一个 <span class="mono">memories.json</span> 到窗口任意位置即可解析。';
    note.innerHTML = (isWatching()
      ? '正在监视 <span class="mono">'+esc(SRC.name)+'</span>，文件更新会自动刷新。'
      : (SRC.mode==='snapshot'||SRC.mode==='sample' ? '当前是一次性快照，不会自动更新。' : '')) + stats;
  }
}
function tipText(){
  const P=[];
  if(SRC.error) P.push('<div class="sp-err">最近一次错误：'+esc(SRC.error)+'</div>');
  if(SRC.mode==='server'){
    P.push('由本地监视服务提供，文件一变立即推送，不靠轮询。');
    P.push('启动方式：<code>python memory_extract.py --serve</code>');
  } else if(SRC.mode==='handle'){
    P.push('这个文件已经被浏览器记下（IndexedDB 里存的是文件句柄），下次打开本页会自动接上。');
    P.push('完整路径由浏览器保管，页面读不到，只能拿到文件名。');
  } else if(SRC.mode==='pending'){
    P.push('上次绑定的文件还记得，但浏览器需要你点一下「恢复监视」才允许读取。');
  } else if(SRC.mode==='snapshot' || SRC.mode==='sample'){
    P.push('这是一次性快照，不会自动更新。点「重新绑定」把文件记住，之后就能自动刷新。');
  }
  if(SRC.mode!=='server'){
    P.push('想要真正"跟着文件变"：运行 <code>python memory_extract.py --serve</code>，它会打开同一个页面并实时推送。');
  }
  if(!window.showOpenFilePicker) P.push('当前浏览器不支持文件句柄，只能每次手动选文件；建议用 Chrome / Edge。');
  return P.join('<br>');
}

/* 解析并渲染；keep=true 时保留当前选中的猫与标签页 */
function applyText(text, name, opts){
  opts = opts || {};
  const prevSEL = SEL, prevTAB = TAB;
  const before = PUPS.reduce((a,b)=>a+b.mem.length,0);
  try{
    normalize(parseMemories(text));
    if(!PUPS.length) throw new Error('文件里没有任何猫崽记录');
  }catch(e){
    SRC.error = '解析失败：' + e.message;
    renderSource();
    if(opts.auto) toast('文件可能正在写入，已保留上一份数据');
    else if(!opts.quiet) alert('解析失败：' + e.message);
    return false;
  }
  if(opts.keep){
    SEL = (prevSEL && PUPS.some(p=>p.key===prevSEL)) ? prevSEL : (PUPS[0]?PUPS[0].key:null);
    TAB = prevTAB || 'overview';
  } else {
    SEL = PUPS[0] ? PUPS[0].key : null;
    TAB = 'overview'; F.q=''; F.cat='all'; F.tag='all'; F.kinds=new Set([0,1,2,3]);
  }
  if(name) SRC.name = name;
  SRC.lastSync = Date.now(); SRC.error = '';
  renderSource(); renderSidebar(); renderMain();
  if(opts.cache !== false){
    try{ localStorage.setItem('noisypup.mem', text.slice(0,4.5e6)); localStorage.setItem('noisypup.name', SRC.name||''); }catch(e){}
  }
  const after = PUPS.reduce((a,b)=>a+b.mem.length,0);
  if(opts.auto){
    const d = after - before;
    toast('已自动更新' + (d>0 ? ' · 新增 '+d+' 条记忆' : (d<0 ? ' · 少了 '+(-d)+' 条' : ' · 内容有变化')));
  } else if(!opts.quiet){
    toast('解析完成：'+PUPS.length+' 只猫崽，'+after+' 条记忆');
  }
  return true;
}
function loadSample(quiet){
  SRC.mode='sample'; SRC.name='内置示例'; SRC.path='';
  SRC.handle=null; SRC.pendingHandle=null; SRC.lastModified=0;
  stopTimer(); closeSSE();
  applyText(JSON.stringify(SAMPLE), '内置示例', {quiet:!!quiet, keep:false, cache:false});
}

/* ---------- 模式一：本地监视服务（实时推送） ---------- */
async function probeServer(){
  try{
    const ctl = new AbortController();
    const t = setTimeout(()=>ctl.abort(), 1800);
    const r = await fetch('api/state', {cache:'no-store', signal:ctl.signal});
    clearTimeout(t);
    if(!r.ok) return null;
    const j = await r.json();
    return (j && j.ok) ? j : null;
  }catch(e){ return null; }
}
async function fetchServerText(){
  const r = await fetch('api/data?t='+Date.now(), {cache:'no-store'});
  if(r.status === 503) throw new Error('文件正在被写入');
  if(!r.ok) throw new Error('HTTP '+r.status);
  return await r.text();
}
function connectSSE(){
  closeSSE();
  try{
    let first = true;   // 服务端连上就先推一次当前状态，这一次不用再拉一遍
    const es = new EventSource('api/events');
    es.onmessage = ev=>{
      let d=null; try{ d = JSON.parse(ev.data); }catch(e){}
      if(first){ first = false; return; }
      if(d && d.type==='update'){ refreshNow('auto'); fetchJourney(); }
    };
    SRC.sse = es;
  }catch(e){}
}
function closeSSE(){ if(SRC.sse){ try{ SRC.sse.close(); }catch(e){} SRC.sse=null; } }
async function connectServer(st){
  SRC.serverOK = true; SRC.serverInfo = st || {};
  SRC.mode='server'; SRC.name = (st&&st.name) || 'memories.json'; SRC.path = (st&&st.path) || '';
  SRC.lastModified = (st&&st.mtime) ? st.mtime*1000 : 0;
  SRC.handle=null; SRC.pendingHandle=null;
  stopTimer();
  try{
    applyText(await fetchServerText(), SRC.name, {quiet:true, keep:true, auto:false});
  }catch(e){ SRC.error='读取失败：'+e.message; }
  if(SRC.auto) connectSSE();
  renderSource();
  toast('已连接本地监视服务 · 文件变化会立即刷新');
}

/* ---------- 模式二：记住文件（File System Access 句柄 + 轮询） ---------- */
async function bindFile(){
  if(window.showOpenFilePicker){
    try{
      const [h] = await window.showOpenFilePicker({
        id:'noisypup-memories', multiple:false,
        types:[{description:'memories.json', accept:{'application/json':['.json']}}]
      });
      await adoptHandle(h, {interactive:true});
      return;
    }catch(e){
      if(e && e.name==='AbortError') return;         // 用户自己取消
      toast('无法记住路径（'+(e.name||'不支持')+'），改为手动选择一次');
    }
  }
  $('#fileInput').click();
}
async function adoptHandle(h, opts){
  opts = opts || {};
  try{
    let perm = 'prompt';
    try{ perm = await h.queryPermission({mode:'read'}); }catch(e){ perm='prompt'; }
    if(perm !== 'granted'){
      try{ perm = await h.requestPermission({mode:'read'}); }catch(e){ perm='denied'; }
    }
    if(perm !== 'granted') throw new Error('没有获得读取权限');

    const f = await h.getFile();
    const text = await f.text();

    closeSSE();
    SRC.mode='handle'; SRC.handle=h; SRC.pendingHandle=null; SRC.path='';
    SRC.name = f.name || 'memories.json';
    SRC.lastModified = f.lastModified || Date.now(); SRC.size = f.size;
    if(!applyText(text, SRC.name, {quiet:true, keep:true, auto:false})) throw new Error('内容不是有效的记忆文件');
    await idbSet('handle', h);
    startTimer(); renderSource();
    if(opts.interactive) toast('已记住 '+SRC.name+' · 文件一变就自动刷新');
    return true;
  }catch(e){
    SRC.error = (e && e.name==='NotFoundError') ? '文件已被移动或删除' : (e.message || String(e));
    if(SRC.mode!=='handle') SRC.mode = 'none';
    renderSource();
    if(opts.interactive) alert('绑定失败：'+(e.message||e.name));
    return false;
  }
}
async function restoreHandle(){
  const h = await idbGet('handle');
  if(!h || typeof h.getFile !== 'function') return false;
  let perm='prompt';
  try{ perm = await h.queryPermission({mode:'read'}); }catch(e){ perm='prompt'; }
  if(perm==='granted') return await adoptHandle(h, {interactive:false});
  SRC.pendingHandle = h; SRC.mode='pending';
  SRC.name = h.name || 'memories.json';
  renderSource();
  return false;
}
function stopTimer(){ if(SRC.timer){ clearInterval(SRC.timer); SRC.timer=null; } }
function startTimer(){
  stopTimer();
  if(SRC.mode!=='handle' || !SRC.auto) return;
  SRC.timer = setInterval(pollHandle, Math.max(1,SRC.interval)*1000);
}
async function pollHandle(force){
  if(!SRC.handle || SRC.busy) return;
  SRC.busy = true;
  try{
    const f = await SRC.handle.getFile();
    if(force || f.lastModified !== SRC.lastModified || f.size !== SRC.size){
      const text = await f.text();
      SRC.lastModified = f.lastModified || Date.now(); SRC.size = f.size;
      applyText(text, f.name || SRC.name, {quiet:true, keep:true, auto:!force});
    } else {
      SRC.lastSync = Date.now(); SRC.error='';
    }
  }catch(e){
    SRC.error = (e && e.name==='NotFoundError') ? '文件已被移动或删除' : ('读取失败：'+(e.name||e.message));
  }
  SRC.busy = false;
  renderSource();
}

/* ---------- 统一刷新入口 ---------- */
async function refreshNow(kind){
  if(SRC.mode==='server'){
    try{
      applyText(await fetchServerText(), SRC.name, {quiet:true, keep:true, auto:kind==='auto'});
    }catch(e){
      SRC.error = '读取失败：'+e.message;
      renderSource();
      if(kind==='manual') toast('读取失败：'+e.message);
    }
  } else if(SRC.mode==='handle'){
    await pollHandle(kind==='manual');
  } else if(SRC.mode==='pending'){
    if(!await restoreHandle()) toast('请在面板里点「恢复监视」授权读取');
  } else {
    if(SRC.serverOK){ await connectServer(SRC.serverInfo||{}); return; }
    if(kind==='manual') bindFile();
  }
}

/* 普通方式打开的文件：只能当快照 */
async function readSnapshot(file){
  try{
    const text = await file.text();
    closeSSE(); stopTimer(); idbDel('handle');
    SRC.mode='snapshot'; SRC.handle=null; SRC.pendingHandle=null; SRC.path='';
    SRC.lastModified = file.lastModified || 0; SRC.size = file.size;
    if(applyText(text, file.name, {keep:false, quiet:false})){
      renderSource();
      toast('已载入快照 · 想自动刷新请点「重新绑定」');
    }
  }catch(e){ alert('读取文件失败：'+e.message); }
}

/* ============================================================ 选一个文件夹，全自动 */
/* 不需要 Python、不需要开服务：文件夹里有什么就读什么，
   memories.json 取层级最浅的，journey-*.jsonl 取最新的一份。 */

function folderPickEntries(files){
  return Array.from(files || []).map(f => ({
    path: (f.webkitRelativePath || f.name || '').replace(/\\/g, '/'),
    f: f
  }));
}

async function readDirHandle(dir, prefix, out, depth){
  if(depth > 3) return out;
  try{
    for await (const [name, h] of dir.entries()){
      const pth = prefix ? prefix + '/' + name : name;
      if(h.kind === 'file'){
        if(/\.jsonl?$/i.test(name)){
          try{ out.push({path: pth, f: await h.getFile()}); }catch(e){}
        }
      }else if(depth < 3 && !/^(text|PupText|newest|bin|obj|Assets|sound|music|illustrations)$/i.test(name)){
        await readDirHandle(h, pth, out, depth+1);
      }
    }
  }catch(e){}
  return out;
}

async function loadFolderEntries(entries){
  entries = entries || [];
  const mems = [], jrn = [];
  entries.forEach(e=>{
    const base = String(e.path || '').split('/').pop();
    if(/^memories\.json$/i.test(base)) mems.push(e);
    else if(/^journey-.*\.jsonl$/i.test(base)) jrn.push(e);
  });

  if(!mems.length && !jrn.length){
    toast('这个文件夹里没找到 memories.json 或 logs/journey-*.jsonl');
    return;
  }

  const loaded = [];

  if(mems.length){
    // 层级最浅的那个才是模组根目录里的记忆文件
    mems.sort((a,b)=>{
      const da = a.path.split('/').length, db = b.path.split('/').length;
      return da - db || ((b.f.lastModified||0) - (a.f.lastModified||0));
    });
    const m = mems[0];
    try{
      const text = await m.f.text();
      closeSSE(); stopTimer(); idbDel('handle');
      SRC.mode='snapshot'; SRC.handle=null; SRC.pendingHandle=null; SRC.path = m.path;
      SRC.lastModified = m.f.lastModified || 0; SRC.size = m.f.size;
      if(applyText(text, m.f.name, {keep:false, quiet:true})){ renderSource(); loaded.push('记忆'); }
    }catch(e){ alert('读 memories.json 失败：' + e.message); }
  }

  if(jrn.length){
    // 按修改时间取最新；时间一样时才偏向 logs/ 里那份
    jrn.sort((a,b)=>{
      const la = /\/logs\//i.test(a.path) ? 0 : 1;
      const lb = /\/logs\//i.test(b.path) ? 0 : 1;
      return ((b.f.lastModified||0) - (a.f.lastModified||0)) || (la - lb);
    });
    const j = jrn[0];
    try{
      const text = await j.f.text();
      JSRC.mode='snapshot'; JSRC.name = j.f.name; JSRC.path = j.path;
      JSRC.handle=null; JSRC.pendingHandle=null; JSRC.error='';
      JSRC.lastModified = j.f.lastModified || 0; JSRC.size = j.f.size;
      parseJourney(text, j.f.name, j.path);
      if(typeof renderJourneySource==='function') renderJourneySource();
      loaded.push('日志 ' + j.f.name);
    }catch(e){ alert('读旅程日志失败：' + e.message); }
  }

  if(loaded.length) toast('已载入：' + loaded.join(' + ') + '（快照，想自动刷新用 --serve 或重新载入）');
}

let dragDepth=0;
window.addEventListener('dragenter', e=>{ e.preventDefault(); dragDepth++; if(e.dataTransfer.types.includes('Files')) $('#drop').classList.add('on'); });
window.addEventListener('dragover', e=> e.preventDefault());
window.addEventListener('dragleave', e=>{ dragDepth--; if(dragDepth<=0){ dragDepth=0; $('#drop').classList.remove('on'); } });
window.addEventListener('drop', async e=>{
  e.preventDefault(); dragDepth=0; $('#drop').classList.remove('on');
  // 拖进来的文件也能拿到"句柄"，因此同样可以记住路径、自动跟随更新
  const items = e.dataTransfer && e.dataTransfer.items;
  if(items && items[0] && typeof items[0].getAsFileSystemHandle === 'function'){
    try{
      const h = await items[0].getAsFileSystemHandle();
      if(h && h.kind === 'file'){
        // .jsonl 是旅程日志，.json 是记忆文件
        if(/\.jsonl$/i.test(h.name || '')){ await adoptJourneyHandle(h, {interactive:true}); return; }
        await adoptHandle(h, {interactive:true}); return;
      }
      if(h && h.kind === 'directory'){
        // 拖整个模组文件夹：自己找 memories.json 和最新的 journey-*.jsonl
        const out = [];
        await readDirHandle(h, h.name || '', out, 0);
        if(out.length){ await loadFolderEntries(out); return; }
        toast('这个文件夹里没找到记忆或日志');
        return;
      }
    }catch(err){}
  }
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if(f){
    if(/\.jsonl$/i.test(f.name || '')){ readJourneySnapshot(f); return; }
    readSnapshot(f);
  }
});

const JSRC = { mode:'none', name:'', handle:null, pendingHandle:null,
               lastModified:0, size:0, timer:null, busy:false, error:'' };

function jStartTimer(){

}
function jStopTimer(){ if(JSRC.timer){ clearInterval(JSRC.timer); JSRC.timer=null; } }

async function adoptJourneyHandle(h, opts){
  opts = opts || {};
  try{
    let perm = 'prompt';
    try{ perm = await h.queryPermission({mode:'read'}); }catch(e){ perm='prompt'; }
    if(perm !== 'granted'){
      try{ perm = await h.requestPermission({mode:'read'}); }catch(e){ perm='denied'; }
    }
    if(perm !== 'granted') throw new Error('没有获得读取权限');

    const f = await h.getFile();
    const text = await f.text();

    JSRC.mode='handle'; JSRC.handle=h; JSRC.pendingHandle=null;
    JSRC.name = f.name || 'journey.jsonl';
    JSRC.lastModified = f.lastModified || Date.now(); JSRC.size = f.size;
    parseJourney(text, JSRC.name);
    await idbSet('journey-handle', h);
    jStartTimer();
    if(opts.interactive) toast('已记住 '+JSRC.name+' · 文件一变就自动刷新');
    return true;
  }catch(e){
    JSRC.error = (e && e.name==='NotFoundError') ? '文件已被移动或删除' : (e.message || String(e));
    if(JSRC.mode!=='handle') JSRC.mode = 'none';
    if(opts.interactive) alert('绑定旅程日志失败：'+(e.message||e.name));
    return false;
  }
}

async function restoreJourneyHandle(){
  const h = await idbGet('journey-handle');
  if(!h || typeof h.getFile !== 'function') return false;
  let perm='prompt';
  try{ perm = await h.queryPermission({mode:'read'}); }catch(e){ perm='prompt'; }
  if(perm==='granted') return await adoptJourneyHandle(h, {interactive:false});
  JSRC.pendingHandle = h; JSRC.mode='pending';
  JSRC.name = h.name || 'journey.jsonl';
  return false;
}

async function jPollHandle(force){
  if(!JSRC.handle || JSRC.busy) return;
  JSRC.busy = true;
  try{
    const f = await JSRC.handle.getFile();
    if(force || f.lastModified !== JSRC.lastModified || f.size !== JSRC.size){
      const text = await f.text();
      JSRC.lastModified = f.lastModified || Date.now(); JSRC.size = f.size;
      parseJourney(text, f.name || JSRC.name);
    }
  }catch(e){
    JSRC.error = (e && e.name==='NotFoundError') ? '文件已被移动或删除' : ('读取失败：'+(e.name||e.message));
  }
  JSRC.busy = false;
}

async function bindJourneyFile(){
  if(window.showOpenFilePicker){
    try{
      const [h] = await window.showOpenFilePicker({
        id:'noisypup-journey', multiple:false,
        types:[{description:'journey-*.jsonl', accept:{'application/json':['.jsonl']}}]
      });
      await adoptJourneyHandle(h, {interactive:true});
      return;
    }catch(e){
      if(e && e.name==='AbortError') return;
      toast('无法记住路径（'+(e.name||'不支持')+'），改为手动选择一次');
    }
  }
  $('#journeyInput').click();
}

function readJourneySnapshot(file){
  const r = new FileReader();
  r.onload = ()=>{
    JSRC.mode='snapshot'; JSRC.name = file.name; JSRC.handle=null; JSRC.pendingHandle=null;
    parseJourney(String(r.result||''), file.name);
    toast('旅程日志已载入：'+file.name+'（快照，不会自动刷新）');
  };
  r.readAsText(file, 'utf-8');
}

$('#btnJourney').onclick = ()=> bindJourneyFile();
$('#journeyInput').onchange = e=>{
  const f = e.target.files && e.target.files[0];
  e.target.value='';
  if(f) readJourneySnapshot(f);
};

/* 旅程日志来源面板（与记忆文件同一套 UI） */
function renderJourneySource(){
  const chip=$('#jChip'), txt=$('#jTxt'), sync=$('#jSync');
  const mode = JSRC.mode;
  chip.classList.toggle('live', (mode==='handle' && SRC.auto) || mode==='server');
  chip.classList.toggle('warn', mode==='pending' || mode==='snapshot');
  chip.classList.toggle('err', !!JSRC.error);
  txt.textContent = JSRC.name || '旅程日志';
  chip.title = (JSRC.path || JSRC.name || '旅程日志') + '　点击查看刷新设置';
  let s = '· 未载入';
  if(JSRC.error) s = '· 读取异常';
  else if(mode==='handle') s = SRC.auto ? ('· 每 '+SRC.interval+' 秒') : '· 已暂停';
  else if(mode==='snapshot') s = '· 快照';
  else if(mode==='pending') s = '· 待恢复';
  else if(mode==='server') s = '· 自动';
  sync.textContent = s;

  const modeTxt = {handle:'已绑定文件（轮询）', pending:'已记住文件，待授权',
                   snapshot:'一次性快照', server:'本地服务 · 自动跟随最新一份',
                   none:'未载入'}[mode] || '—';
  const set=(id,v)=>{ const el=$(id); if(el) el.textContent=v; };
  set('#jMode', modeTxt);
  set('#jFile', JSRC.name || '—');
  const jf=$('#jFile'); if(jf) jf.title = JSRC.path || JSRC.name || '';
  set('#jCount', JOURNEY ? JOURNEY.length+' 事件' : '—');
  set('#jMtime', JSRC.lastModified ? fmtClock(JSRC.lastModified) : '—');
  const au=$('#jAuto');
  if(au) au.checked = SRC.auto;
  const bind=$('#jBind');
  if(bind) bind.textContent = (mode==='pending' && JSRC.pendingHandle) ? '恢复监视' : '绑定文件';
  const tip=$('#jTip');
  if(tip){
    const P=[];
    if(JSRC.error) P.push('<div class="sp-err">最近一次错误：'+esc(JSRC.error)+'</div>');
    if(mode==='handle') P.push('这个文件已经被浏览器记下，文件一变就自动重新解析。');
    else if(mode==='pending') P.push('上次绑定的日志还记得，点「恢复监视」授权读取。');
    else if(mode==='snapshot') P.push('当前是快照，点「绑定文件」记住它，之后自动刷新。');
    else P.push('点「绑定文件」选一份 journey-*.jsonl，或拖它进窗口。');
    if(!window.showOpenFilePicker) P.push('当前浏览器不支持文件句柄，只能手动选文件；建议用 Chrome / Edge。');
    tip.innerHTML = P.join('<br>');
  }
}
function openJourneyPanel(v){
  const p=$('#jPanel'); if(!p) return;
  p.hidden = !v;
  $('#jChip').classList.toggle('open', !!v);
  $('#jChip').setAttribute('aria-expanded', v?'true':'false');
  if(v) renderJourneySource();
}
$('#jChip').onclick = e=>{ e.stopPropagation(); openJourneyPanel($('#jPanel').hidden); };
document.addEventListener('click', e=>{
  const w=$('#jWrap');
  if(w && !w.contains(e.target)) openJourneyPanel(false);
});
$('#jRefresh').onclick = ()=>{ if(JSRC.mode==='handle') jPollHandle(true); else bindJourneyFile(); };
$('#jBind').onclick = ()=>{
  if(JSRC.mode==='pending' && JSRC.pendingHandle) adoptJourneyHandle(JSRC.pendingHandle, {interactive:true});
  else bindJourneyFile();
};
$('#jUnbind').onclick = async ()=>{
  await idbDel('journey-handle');
  jStopTimer();
  JSRC.handle=null; JSRC.pendingHandle=null; JSRC.mode='none'; JSRC.error='';
  renderJourneySource();
  toast('已解除旅程日志绑定');
};
$('#jAuto').onchange = e=>{
  SRC.auto = e.target.checked; saveSettings();
  startTimer(); jStartTimer(); renderSource(); renderJourneySource();
  toast(SRC.auto ? '自动刷新已开启' : '自动刷新已暂停');
};

/* 启动 */
loadSettings();
(async function boot(){
  // 1) 先用上次的快照把界面点亮（秒开），随后再升级为"实时"
  let cached=null, cachedName='';
  try{ cached = localStorage.getItem('noisypup.mem'); cachedName = localStorage.getItem('noisypup.name')||''; }catch(e){}
  if(cached){ SRC.mode='snapshot'; applyText(cached, cachedName || '上次的数据', {quiet:true, keep:false, auto:false}); }
  else loadSample(true);

  // 2) 优先接本地监视服务（实时推送）；否则恢复记住的文件（轮询）
  const st = await probeServer();
  if(st){ await connectServer(st); fetchJourney(); }
  else {
    SRC.serverOK = false;
    const ok = await restoreHandle();
    if(!ok && SRC.mode!=='pending') renderSource();
    if(SRC.mode==='pending') setTimeout(()=>toast('上次的文件还记得 · 点右上角状态条里的「恢复监视」'), 900);
  }

  // 2.5) 旅程日志也恢复记住的句柄（服务模式由 fetchJourney 兜底，这里只管轮询句柄）
  if(SRC.mode!=='server') await restoreJourneyHandle();

  // 3) 支持 #tab=timeline&p=绿绒 直接定位（也方便做截图核对）
  try{
    const h = new URLSearchParams(location.hash.replace(/^#/,''));
    const pk = h.get('p');
    if(pk){ const t = PUPS.find(x=>x.key===pk || x.name===pk); if(t) SEL = t.key; }
    const tb = h.get('tab');
    if(tb && ['overview','timeline','chat','impressions','journey','jdialogue','raw'].includes(tb)) TAB = tb;
    const jm = h.get('jm');
    if(jm === 'dialogue' || jm === 'timeline') JVIEW.mode = jm;
    const q = h.get('q');
    if(q){ F.q = q; }
    if(h.get('cm')) F.chatMode = h.get('cm');
    if(h.get('src')) openPanel(true);
    renderSidebar(); renderMain();
  }catch(e){}

  // 4) 面板打开时，定期刷新"上次同步"这类时间文案
  setInterval(()=>{ const p=$('#srcPanel'); if(p && !p.hidden) renderSource(); }, 5000);
})();
</script>
